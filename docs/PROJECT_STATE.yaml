references:
  DEVICE_20260915_214834:
    type: user_device_video
    filename: Screen_Recording_20260915_214834.mp4
    artifact_head: 4e24b94e96ab15f16170196518934ccf3b532d51
    device_verified: true
    visual_accepted: false
    role: "Whole-APK device regression evidence, not attack-animation-only evidence."
    observed_hp_sequence: [76, 48, 28]
    findings:
      - id: D214834_PLAYER_TO_MONSTER_ATTACK
        area: "player -> monster attack"
        status: FAIL
        severity: P0
        observation: "Player cannot reliably attack a monster from relationships where combat appears engaged; player melee legality is not aligned with the opponent relationship."
      - id: D214834_MONSTER_TO_PLAYER_ATTACK
        area: "monster -> player attack"
        status: FAIL
        severity: P0
        observation: "Monster can damage the player while the player cannot legally reciprocate from the corresponding relationship."
      - id: D214834_MONSTER_MOVEMENT
        area: "monster movement"
        status: PARTIAL
        severity: P0
        observation: "Monster movement is closer to four diagonal directions, but tile-center occupancy and attack position are not proven to be one canonical contract."
      - id: D214834_ATTACK_BODY
        area: "player attack BODY"
        status: FAIL
        severity: P0
        observation: "No meaningful temporal player BODY attack is visible."
      - id: D214834_ATTACK_WEAPON
        area: "mokdo attack"
        status: FAIL
        severity: P0
        observation: "Weapon separates from BODY/hand and attacks as a floating independent sprite."
      - id: D214834_WALK_WEAPON
        area: "walk mokdo attachment"
        status: PARTIAL
        severity: P1
        observation: "Large twisting regression is mostly improved, but residual direction/frame hand-to-weapon misalignment remains."
      - id: D214834_ATTACK_SCALE
        area: "character scale continuity"
        status: UNVERIFIED
        severity: P0
        observation: "Current build removed meaningful BODY attack, so the previous regression where attack BODY changed apparent character size/anchor cannot be considered fixed."
      - id: D214834_HIT_PRESENTATION
        area: "hit presentation"
        status: FAIL
        severity: P1
        observation: "HP decreases, including observed 76 -> 48 -> 28, without sufficiently readable target contact/reaction."
      - id: D214834_COMBAT_READABILITY
        area: "combat readability"
        status: FAIL
        severity: P1
        observation: "Character motion alone does not clearly communicate who attacked whom and when contact occurred."
      - id: D214834_MOVE_COMBAT_LINK
        area: "movement/combat linkage"
        status: FAIL
        severity: P0
        observation: "Observed behavior is consistent with movement target/tile occupancy and combat adjacency/attack snapshot not sharing one authoritative logical-coordinate pipeline."
      - id: D214834_MILLES_GROUND
        area: "Milles ground semantics"
        status: PARTIAL_PASS
        severity: P2
        observation: "Grass/dirt semantic mapping is now materially improved and must not regress."
      - id: D214834_MILLES_PATHS
        area: "Milles paths"
        status: FAIL_INITIAL
        severity: P1
        observation: "Paths remain broad/regular diagonal bands and do not yet read as natural lived-in village circulation."
      - id: D214834_MILLES_COMPOSITION
        area: "Milles spatial composition"
        status: FAIL_INITIAL
        severity: P1
        observation: "Well/church/bench/sign exist, but large flower-grass empty areas remain; plaza -> residential -> commerce -> church -> waterside -> gate spatial story is not yet mature."
      - id: D214834_UI_WORLD_BALANCE
        area: "HUD/world balance"
        status: PARTIAL
        severity: P2
        observation: "Left quest, bottom chat and right skill controls occupy substantial screen area; HUD currently competes strongly with world readability."
      - id: D214834_MONSTER_VISUAL
        area: "monster visual"
        status: FAIL
        severity: P1
        observation: "Monster remains a temporary/simple adapted presentation rather than accepted authored game content."
    pipeline_diagnosis:
      status: FAILED
      severity: P0
      contract: "logical coordinate -> target -> canonical tile occupancy/adjacency -> reciprocal legality/facing snapshot -> attack state/animation -> contact/hit -> target reaction"
      rule: "Do not repair only the final animation symptom while upstream coordinate/adjacency/snapshot contracts remain inconsistent. Do not declare the pipeline fixed from static code presence alone."

