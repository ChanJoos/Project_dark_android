schema_version: 1
project:
  name: PROJECT DARK
  product: "Legend of Darkness-inspired Android mobile game"
  phase: production_vertical_slice
  state_policy: "Single autonomous-development control plane. Update only repository or user/device-supported facts."
  repository: ChanJoos/Project_dark_android
  default_branch: main

acceptance_states:
  implementation: [NOT_WIRED, PARTIAL, IMPLEMENTED, INTEGRATED, BUILD_VERIFIED]
  observable: [UNVERIFIED, DEVICE_VERIFIED, VISUAL_ACCEPTED, FAIL]
  queue: [DISCOVERED, READY, IN_PROGRESS, VERIFICATION_PENDING, PENDING_DEVICE, ACCEPTED, BLOCKED]

canonical_indexes:
  design: [design/DESIGN_CONSTITUTION.md, design/DATA_CONTRACT.md, design/SOURCE_OF_TRUTH.md, "design/PLAYTEST_CANON_*"]
  master: [master/MASTER_MANIFEST.md, master/CONVERSION_MANIFEST.json, master/VALIDATION_REPORT.json]
  direction: [docs/MILLES_WORLD_DIRECTION.md]
  autonomy:
    constitution: docs/PROJECT_DARK_DEVELOPMENT_CONSTITUTION.md
    state: docs/PROJECT_STATE.yaml
    baton: docs/AUTONOMY_BATON.md

resource_registry:
  world_map:
    master_globs: [master/data/Map_*Master.csv, master/data/Map_Instance_Master.csv, master/data/Spawn_Master.csv, master/data/Asset_Map_Mapping.csv]
    direction_files: [docs/MILLES_WORLD_DIRECTION.md]
    runtime_roots: [app/src/main/java/com/projectdark/mobile/world/, app/src/main/java/com/projectdark/mobile/]
  character_visual:
    master_files: [master/data/Asset_Character_Mapping.csv, master/data/Asset_Animation_Frame_Master.csv, master/data/Asset_Animation_Semantics.csv]
    runtime_roots: [app/src/main/java/com/projectdark/mobile/, app/src/main/assets/]
  combat:
    master_files: [master/data/Asset_Animation_Frame_Master.csv, master/data/Asset_Animation_Semantics.csv, master/data/Asset_Character_Mapping.csv]
    runtime_roots: [app/src/main/java/com/projectdark/mobile/]
  monster:
    master_files: [master/data/Monster_Master.csv, master/data/Monster_Sources.csv, master/data/Monster_Research_Audit.csv, master/data/Asset_Monster_Mapping.csv]

references:
  DEVICE_20260915_214834:
    type: user_device_video
    filename: Screen_Recording_20260915_214834.mp4
    artifact_head: 4e24b94e96ab15f16170196518934ccf3b532d51
    device_verified: true
    visual_accepted: false
    findings:
      - "P0 COMBAT_RECIPROCITY: monster can damage player from relationships in which player cannot legally hit the monster; player and monster melee legality/facing are not one reciprocal canonical tile contract."
      - "P0 ATTACK_BODY_ANIMATION: visible player attack does not present a temporal BODY attack sequence; character presentation remains effectively static while the weapon attacks."
      - "P0 WEAPON_BODY_ATTACHMENT: mokdo visibly separates from the hand/body and attacks as a floating independent sprite."
      - "P1 WALK_WEAPON_ATTACHMENT: major walk twisting is improved but residual hand/weapon alignment error remains."
      - "P0 ATTACK_SCALE_CONTINUITY: previous attack-body implementation changed apparent character size/anchor; current removal of body attack does not prove that regression fixed. Must verify scale and foot anchor before acceptance."
      - "P1 HIT_PRESENTATION: HP changes occur without sufficiently readable target contact/reaction presentation."
      - "P1 MILLES_COMPOSITION: grass/dirt semantics improved, but paths remain overly regular and large areas read sparse relative to the intended coherent medieval village."
      - "P1 MONSTER_VISUAL: monster presentation remains placeholder/adapted rather than accepted authored content."

scenes:
  SCENE_FIELD_COMBAT:
    title: Field combat loop
    resources: [character_visual, combat, monster]
    references: [DEVICE_20260915_214834]
    implementation: PARTIAL
    observable: FAIL
    gaps: [COMBAT_CONTRACT_002, ATTACK_PRESENTATION_002, MONSTER_RUNTIME_001]
  SCENE_MILLES_VILLAGE:
    title: Milles village traversal
    resources: [world_map, character_visual]
    references: [DEVICE_20260915_214834]
    implementation: BUILD_VERIFIED
    observable: FAIL
    gaps: [WORLD_MILLES_001]

work_packages:
  COMBAT_CONTRACT_002:
    title: "Make player and monster melee tile legality reciprocal"
    system: combat
    scenes: [SCENE_FIELD_COMBAT]
    priority: P0
    queue_state: READY
    claim: null
    evidence: [DEVICE_20260915_214834]
    required_sources:
      - master/data/Asset_Animation_Semantics.csv
      - app/src/main/java/com/projectdark/mobile/
    gap: "Exact device evidence shows asymmetric melee reach/legality. Movement, target adjacency, facing, attack trigger and hit resolution must derive from the same canonical logical tile relationship for both actors."
    acceptance:
      - "For every legal adjacent player/monster tile pair, player->monster and monster->player legality are reciprocal under the same 64x32 logical tile relation."
      - "No Euclidean/radius or independent 8-direction attack rule bypasses canonical adjacency."
      - "Facing snapshot and hit resolution consume the same relationship used for legality."
      - "Static/runtime audits cover all four diagonal adjacent relations and reciprocal directions."

  ATTACK_PRESENTATION_002:
    title: "Restore authored BODY+robe+weapon attack presentation without scale or anchor regression"
    system: character_visual
    scenes: [SCENE_FIELD_COMBAT]
    priority: P0
    queue_state: READY
    claim: null
    evidence: [DEVICE_20260915_214834]
    required_sources:
      - master/data/Asset_Animation_Frame_Master.csv
      - master/data/Asset_Animation_Semantics.csv
      - master/data/Asset_Character_Mapping.csv
      - app/src/main/java/com/projectdark/mobile/CharacterRenderer.java
      - app/src/main/java/com/projectdark/mobile/CharacterSemanticRig.java
      - app/src/main/java/com/projectdark/mobile/CharacterSemanticRigEvidenceProbe.java
      - app/src/main/java/com/projectdark/mobile/CharacterVisualEvidenceProbe.java
    gap: "Two-day regression loop: authored player attack BODY was previously shown at mismatched apparent scale/anchor; subsequent fix removed visible BODY attack and left weapon-only motion. Current device evidence shows floating mokdo and no meaningful player BODY attack. Do not solve by deleting BODY attack or by moving weapon alone."
    investigation_gate:
      - "Before renderer changes, audit all authored attack BODY/robe/weapon resources and Master mappings actually present. Distinguish direction variants from temporal frames; do not infer action02_0..3 are temporal merely because four files exist."
      - "Record source canvas size, opaque bounds, foot anchor, torso/hand semantic anchors and intended runtime scale for every consumed direction/frame."
      - "Resolve whether a true authored temporal BODY attack sequence exists. If source sequence is incomplete, record UNRESOLVED_SOURCE_SEQUENCE rather than fabricate frames."
    acceptance:
      - "Attack visibly changes the player's BODY pose; weapon-only animation is an automatic FAIL."
      - "At least two genuinely distinct authored temporal BODY poses must be observed if such source frames exist; direction variants do not count as temporal poses."
      - "Idle/walk->attack->idle preserves apparent character scale and world foot anchor with no pop, jump or size change."
      - "Robe follows the same BODY attack state/anchor contract."
      - "Mokdo handle remains attached to the dominant-hand semantic anchor throughout startup/contact/recovery; floating weapon is FAIL."
      - "No workaround may satisfy acceptance by suppressing the authored BODY attack."
      - "Evidence probe must validate the same runtime contract, not merely resource loadability."

  WORLD_MILLES_001:
    title: "Continue coherent Milles village composition after current combat blockers"
    system: world_map
    scenes: [SCENE_MILLES_VILLAGE]
    priority: P1
    queue_state: READY
    claim: null
    evidence: [DEVICE_20260915_214834]
    required_sources: [docs/MILLES_WORLD_DIRECTION.md, master/data/Asset_Map_Mapping.csv, master/data/Map_Instance_Master.csv]
    gap: "Terrain semantics are improved, but current device video still reads as overly regular paths and sparse flower-grass expanses rather than a mature connected medieval village."

  MONSTER_RUNTIME_001:
    title: "Advance authored monster runtime after combat contract is reciprocal"
    system: monster
    scenes: [SCENE_FIELD_COMBAT]
    priority: P1
    queue_state: READY
    claim: null
    evidence: [DEVICE_20260915_214834]
    required_sources: [master/data/Monster_Master.csv, master/data/Monster_Sources.csv, master/data/Monster_Research_Audit.csv, master/data/Asset_Monster_Mapping.csv]

agent_selection_policy:
  - "Re-sync before selection and read the latest device evidence and failure reasons."
  - "P0 reciprocal combat legality and authored attack presentation are independent blockers; do not let micro-tuning of one starve the other."
  - "For ATTACK_PRESENTATION_002 the investigation gate is mandatory before renderer changes."
  - "Do not repeatedly polish a work item after its acceptance gate is satisfied; advance to the next dependency-valid READY package."
  - "Build pass is not device or visual acceptance."

status_summary:
  visual_acceptance: FAIL
  known_device_evidence: DEVICE_20260915_214834
  next_global_rule: "Consume the 21:48 device regression as current truth. Repair reciprocal melee contract and attack BODY/robe/weapon presentation under their explicit acceptance gates, then advance to Milles composition/monster content rather than remaining in attack micro-tuning."
