  F5M_RESTART_RESTORE_001:
    title: "Restore the active map and complete First RPG Loop state after process restart"
    system: persistence
    scenes: [SCENE_MILLES_VILLAGE, SCENE_FIELD_COMBAT]
    priority: P1
