schema_version: 1
project:
  name: PROJECT DARK
  product: "Legend of Darkness-inspired Android mobile game"
  phase: production_vertical_slice
  state_quality: bootstrap_needs_incremental_enrichment
  state_policy: "This file is the single autonomous-development control plane for resources, scenes, evidence, work packages, claims, and acceptance. Update only facts supported by repository or user/device evidence."
  repository: ChanJoos/Project_dark_android
  default_branch: main
  integration_line: director/milles-grass-first

claim_policy:
  mode: lease
  default_minutes: 75
  rules:
    - "Do not select a READY item with a valid unexpired claim held by another agent."
    - "Before claiming, re-sync because another scheduled agent may have changed the state since this run started."
    - "Release the claim when moving to PENDING_DEVICE, ACCEPTED, BLOCKED, or explicit handoff."

acceptance_states:
  implementation: [NOT_WIRED, PARTIAL, IMPLEMENTED, INTEGRATED, BUILD_VERIFIED]
  observable: [UNVERIFIED, DEVICE_VERIFIED, VISUAL_ACCEPTED, FAIL]
  queue: [DISCOVERED, READY, IN_PROGRESS, PENDING_DEVICE, ACCEPTED, BLOCKED]

canonical_indexes:
  design: [design/DESIGN_CONSTITUTION.md, design/DATA_CONTRACT.md, design/SOURCE_OF_TRUTH.md, "design/PLAYTEST_CANON_*"]
  master: [master/MASTER_MANIFEST.md, master/CONVERSION_MANIFEST.json, master/VALIDATION_REPORT.json]
  reference: [docs/REFERENCE_GROUND_TRUTH.md, docs/reference/]
  direction: [docs/MILLES_WORLD_DIRECTION.md]
  autonomy:
    constitution: docs/PROJECT_DARK_DEVELOPMENT_CONSTITUTION.md
    state: docs/PROJECT_STATE.yaml
    baton: docs/AUTONOMY_BATON.md

resource_registry:
  world_map:
    master_globs: [master/data/Map_*Master.csv, master/data/Map_Instance_Master.csv, master/data/Spawn_Master.csv, master/data/Asset_Map_Mapping.csv]
    direction_files: [docs/MILLES_WORLD_DIRECTION.md]
    runtime_roots: [app/src/main/java/com/projectdark/mobile/world/, app/src/main/java/com/projectdark/mobile/]
    notes: "Existing Milles assets are candidate inputs, not automatically final assets. Audit each needed asset and REUSE/REWORK/REMAKE/NEW as the coherent village design requires."
  character_visual:
    master_files: [master/data/Asset_Character_Mapping.csv, master/data/Asset_Animation_Frame_Master.csv, master/data/Asset_Animation_Semantics.csv]
    runtime_roots: [app/src/main/java/com/projectdark/mobile/, app/src/main/assets/]
  combat:
    runtime_roots: [app/src/main/java/com/projectdark/mobile/]
  monster:
    master_files: [master/data/Monster_Master.csv, master/data/Monster_Sources.csv, master/data/Monster_Research_Audit.csv, master/data/Asset_Monster_Mapping.csv]
  item_equipment:
    master_globs: [master/data/Item_Master.csv, master/data/*Equipment*csv, master/data/*Weapon*csv]
  skill_magic:
    master_globs: [master/data/Skill_*csv, master/data/*Magic*csv]
  npc_quest:
    master_globs: [master/data/*NPC*csv, master/data/*Quest*csv]
  progression_reward:
    master_files: [master/data/Progression_Master.csv, master/data/Monster_Master.csv, master/data/Item_Master.csv]
  ux_save_system:
    master_globs: [master/data/Asset_UI_Mapping.csv, master/data/AUTO_Rules.csv]

references:
  REF_MILLES_VIDEO:
    type: user_reference_video
    repository_pointer: docs/REFERENCE_GROUND_TRUTH.md
    detailed_analysis: docs/reference/MILLES_FRAME_ANALYSIS.md
    repository_status: "UNRESOLVED: both pointer files are absent from the current repository; do not claim they were consumed. Current runtime adaptation uses durable user-approved world direction plus recorded device evidence and existing master/source indexes."
  REF_COMBAT_VIDEO:
    type: user_reference_video
    repository_pointer: docs/REFERENCE_GROUND_TRUTH.md
    detailed_analysis: docs/reference/COMBAT_FRAME_ANALYSIS.md
  DEVICE_20260915_054522:
    type: user_device_video
    filename: Screen_Recording_20260915_054522.mp4
    artifact_head: 063f7876846bb22b3726da66a551c6c67f4ebb36
    device_verified: true
    visual_accepted: false
    findings:
      - "Milles/world view is dominated by a repetitive brown/orange diamond test-board surface and does not match the grass-first reference composition."
      - "Player/monster combat runs, but combat presentation remains partial."
      - "Monster presentation remains adapted/placeholder-like in this tested build."

scenes:
  SCENE_MILLES_VILLAGE:
    title: Milles village traversal
    experience: "Traverse one coherent grass-first 2.5D medieval village; unsupported geography is deliberately [ADAPTED] into the same settlement rather than left blank or filled with arbitrary asset clusters."
    resources: [world_map, character_visual, ux_save_system]
    references: [REF_MILLES_VIDEO, DEVICE_20260915_054522]
    direction: docs/MILLES_WORLD_DIRECTION.md
    implementation: PARTIAL
    observable: FAIL
    gaps: [WORLD_MILLES_001]
  SCENE_FIELD_COMBAT:
    title: Field combat loop
    resources: [character_visual, combat, monster, progression_reward, ux_save_system]
    references: [REF_COMBAT_VIDEO, DEVICE_20260915_054522]
    implementation: PARTIAL
    observable: FAIL
    gaps: [COMBAT_PRESENTATION_001, MONSTER_RUNTIME_001]
  SCENE_EQUIPMENT_CHANGE:
    title: Equipment changes reflected in gameplay
    resources: [item_equipment, character_visual, ux_save_system]
    implementation: PARTIAL
    observable: UNVERIFIED
    gaps: [CONTENT_LINKAGE_001]
  SCENE_SKILL_MAGIC:
    title: Skill and magic use
    resources: [skill_magic, combat, character_visual, ux_save_system]
    implementation: PARTIAL
    observable: UNVERIFIED
    gaps: [CONTENT_LINKAGE_001]
  SCENE_NPC_SHOP_QUEST:
    title: NPC interaction, shop and quest loop
    resources: [npc_quest, item_equipment, progression_reward, world_map, ux_save_system]
    implementation: PARTIAL
    observable: UNVERIFIED
    gaps: [CONTENT_LINKAGE_001]
  SCENE_PROGRESSION_SAVE:
    title: Persistent progression loop
    resources: [progression_reward, item_equipment, ux_save_system]
    implementation: PARTIAL
    observable: UNVERIFIED
    gaps: [CONTENT_LINKAGE_001]

work_packages:
  WORLD_MILLES_001:
    title: "Rebuild Milles as a coherent reference-informed medieval village from the ground up"
    system: world_map
    scenes: [SCENE_MILLES_VILLAGE]
    priority: P0
    queue_state: READY
    claim: null
    evidence: [DEVICE_20260915_054522, REF_MILLES_VIDEO]
    gap: "The prior runtime was a spawn-centered asset cluster/test-board, not a coherent village. Full original geometry is unavailable, so unsupported spaces must be deliberately [ADAPTED] under the governing world direction."
    required_sources:
      - docs/MILLES_WORLD_DIRECTION.md
      - master/MASTER_MANIFEST.md
      - master/data/Asset_Map_Mapping.csv
      - master/data/Map_Instance_Master.csv
      - master/data/Spawn_Master.csv
      - app/src/main/java/com/projectdark/mobile/world/AdaptedMillesMapLayer.java
      - app/src/main/java/com/projectdark/mobile/world/AdaptedMillesMapRenderer.java
      - app/src/main/java/com/projectdark/mobile/WorldDef.java
    unavailable_reference_inputs:
      - "docs/REFERENCE_GROUND_TRUTH.md is referenced by old state but absent from current repository."
      - "docs/reference/MILLES_FRAME_ANALYSIS.md is referenced by old state but absent from current repository."
    source_resolution:
      - "Map_Instance_Master defines MAP_MILLES as Town / original-tile-coordinate hub / NPC-service centered; it does not provide recoverable road, water, or landmark-footprint geometry."
      - "Spawn_Master contains hunting-area spawns only and no MAP_MILLES town spawn geometry."
      - "Asset_Map_Mapping marks MAP_MILLES source as SOURCE_FOUND/REFERENCE but explicitly says the matching image among nine old-town images still requires visual identification."
      - "Therefore exact unobserved road/water/landmark geometry is UNRESOLVED; coherent placement is explicitly [ADAPTED], not claimed original."
    source_gate:
      - "Before coding, load every concrete available required source for the selected package."
      - "If a referenced source path is absent, record it as unavailable/UNRESOLVED and do not claim its evidence was consumed."
      - "Descriptive/wildcard source entries must be resolved to exact files actually consumed and recorded in state/baton."
    design_contract:
      - "Treat Milles as one quiet medieval settlement with spatial story and functional districts, not a collection of available objects."
      - "Author in order: continuous ground -> primary roads/plaza -> secondary paths -> water/terrain/boundaries -> buildings -> vegetation/props -> collision/interaction."
      - "Use verified reference features where available; fill unsupported geography coherently as [ADAPTED], never as claimed original geometry."
      - "Existing Milles production assets are candidates, not final truth: classify needed assets REUSE, REWORK, REMAKE, or NEW and create missing critical assets."
      - "Use stable world-space placement; prohibit spawn+arbitrary-offset landmark clustering."
    progress:
      last_agent: D
      start_head: 9c69f67bb8f9ecdc7a7b8fbb7b666c0f6f9a4f08
      runtime_head: 0e5deb2073b5196a46e022b2fd75163e9833e6ff
      state_head_pending: true
      implementation: BUILD_VERIFIED
      build_verified: true
      build_run: 383
      runtime_delta: "Added stable [ADAPTED] district ground pads and a major east-church landmark footprint before vertical asset reintroduction: north service/residential breathing room, west craft yard, east church forecourt/landmark reserve, and south market commons. All are irregular world-space polygons independent of the navigation-cell grid; exact runtime HEAD passed Master validation, Java compile, debug APK build and artifact upload."
    acceptance:
      - "Entire traversable world has continuous intentional ground with no checkerboard, unexplained voids, or screen-fixed backdrop artifacts."
      - "Camera traversal in all directions preserves world continuity and exposes no un-authored empty side of the map."
      - "Central plaza and functional districts read as one connected settlement with intentional road hierarchy and breathing room."
      - "Water/pond/bridge/rest spaces and vegetation are integrated where the layout calls for them rather than decoration piles."
      - "Buildings/props use stable world-space coordinates and do not read as a spawn-centered cluster."
      - "Needed object set has explicit REUSE/REWORK/REMAKE/NEW disposition; missing critical objects are produced before visual acceptance."
      - "Collision/camera/traversal remain functional."
      - "Exact build reaches BUILD_VERIFIED, then remains PENDING_DEVICE until fresh device evidence."
    next_action: "Preserve the BUILD_VERIFIED floor/district candidate. Audit the candidate Milles production object set and assign REUSE/REWORK/REMAKE/NEW dispositions for church plus first district buildings; then reintroduce only approved vertical assets at the stable landmark footprints."

  COMBAT_PRESENTATION_001:
    title: "Connect authored/source-backed attack presentation into playable combat"
    system: combat
    scenes: [SCENE_FIELD_COMBAT]
    priority: P0
    queue_state: READY
    claim: null
    evidence: [DEVICE_20260915_054522, REF_COMBAT_VIDEO]
    required_sources: [master/data/Asset_Animation_Frame_Master.csv, master/data/Asset_Animation_Semantics.csv, master/data/Asset_Character_Mapping.csv, docs/reference/COMBAT_FRAME_ANALYSIS.md]
  MONSTER_RUNTIME_001:
    title: "Replace unsupported monster placeholder using authored monster path"
    system: monster
    scenes: [SCENE_FIELD_COMBAT]
    priority: P1
    queue_state: READY
    claim: null
    required_sources: [master/data/Monster_Master.csv, master/data/Monster_Sources.csv, master/data/Monster_Research_Audit.csv, master/data/Asset_Monster_Mapping.csv, master/data/Spawn_Master.csv, master/data/Map_Instance_Master.csv]
  CONTENT_LINKAGE_001:
    title: "Expose existing authored content through complete playable loops"
    system: cross_system
    scenes: [SCENE_EQUIPMENT_CHANGE, SCENE_SKILL_MAGIC, SCENE_NPC_SHOP_QUEST, SCENE_PROGRESSION_SAVE]
    priority: P1
    queue_state: READY
    claim: null
    required_sources: [master/MASTER_MANIFEST.md, design/DESIGN_CONSTITUTION.md, design/DATA_CONTRACT.md, design/SOURCE_OF_TRUTH.md]

agent_selection_policy:
  - "Re-sync before selection and verify baton/claims."
  - "Before coding, load every concrete available required source for the selected package; absent referenced paths must be explicitly recorded UNRESOLVED rather than silently treated as consumed."
  - "If a new canonical direction/design document materially governs selected work, register it in the work package required_sources before implementation."
  - "Prefer the highest-priority READY unclaimed package whose dependencies can be resolved."
  - "If a P0 item becomes PENDING_DEVICE, move to another READY package until new evidence arrives."
  - "Documentation/control-plane changes alone are not runtime progress when a runtime delta is technically possible."

status_summary:
  visual_acceptance: FAIL
  known_device_evidence: DEVICE_20260915_054522
  next_global_rule: "PROJECT_STATE points to mandatory implementation inputs. Runtime/evidence outrank stale status text; unavailable referenced evidence must be recorded rather than invented."
