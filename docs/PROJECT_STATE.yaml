  product: "Legend of Darkness-inspired Android mobile game"
  phase: production_vertical_slice
  state_policy: "Single autonomous-development control plane. Every active scheduled developer/verifier must read this state before selecting work. Device evidence findings must remain actionable until their own acceptance criteria are satisfied or explicitly superseded."
  repository: ChanJoos/Project_dark_android
  default_branch: main

acceptance_states:
