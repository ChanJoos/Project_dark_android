name: Verify immutable V89 delivery
on:
  push:
    paths:
      - .github/workflows/v89-delivery.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a4dcc1086f283fd49b7673c8fa5c4ddf8c140f97
      - uses: actions/download-artifact@v4
        with:
          name: PROJECT_DARK-debug-a4dcc1086f283fd49b7673c8fa5c4ddf8c140f97
          run-id: 37022876847
          github-token: ${{ github.token }}
          path: delivery-apk
      - uses: actions/download-artifact@v4
        with:
          name: device-review-a4dcc1086f283fd49b7673c8fa5c4ddf8c140f97
          run-id: 37022876847
          github-token: ${{ github.token }}
          path: delivery-captures
      - name: Verify exact APK source, manifest and all tracked packaged assets
        run: |
          python3 - <<'PY'
          import struct,zipfile,json,hashlib,subprocess,datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          source='a4dcc1086f283fd49b7673c8fa5c4ddf8c140f97'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          apk=Path('delivery-apk/app-debug.apk');z=zipfile.ZipFile(apk,metadata_encoding='utf-8');assert z.testzip() is None
          b=z.read('AndroidManifest.xml');offset=8;strings=[];attrs={}
          while offset<len(b):
              kind,header,size=struct.unpack_from('<HHI',b,offset)
              if kind==1:
                  count,styles,flags,start,styleStart=struct.unpack_from('<5I',b,offset+8)
                  for i in range(count):
                      pos=offset+start+struct.unpack_from('<I',b,offset+header+4*i)[0]
                      def length8(pos):
                          a=b[pos];return ((a&127)<<8|b[pos+1],pos+2) if a&128 else (a,pos+1)
                      if flags&256:
                          _,pos=length8(pos);n,pos=length8(pos);strings.append(b[pos:pos+n].decode('utf-8'))
                      else:
                          n=struct.unpack_from('<H',b,pos)[0];pos+=2
                          if n&32768:n=((n&32767)<<16)|struct.unpack_from('<H',b,pos)[0];pos+=2
                          strings.append(b[pos:pos+n*2].decode('utf-16le'))
              elif kind==0x102:
                  ns,name,attrStart,attrSize,count=struct.unpack_from('<IIHHH',b,offset+16)
                  if strings[name]=='manifest':
                      for i in range(count):
                          p=offset+16+attrStart+i*attrSize;ns,name,raw,valueSize,res,typ,data=struct.unpack_from('<IIIHBBI',b,p)
                          attrs[strings[name]]=strings[data] if typ==3 else data
              offset+=size
          assert attrs['versionCode']==89 and attrs['versionName']=='0.89-martial-auto-hud',attrs
          files=subprocess.check_output(['git','ls-files','-z','app/src/main/assets'],text=True).split('\0')[:-1];missing=[];different=[]
          for p in files:
              key=p.removeprefix('app/src/main/')
              if key not in z.namelist():missing.append(p)
              elif z.read(key)!=Path(p).read_bytes():different.append(p)
          print('APK_ASSET_NAME_DIAGNOSTIC',[(n,z.getinfo(n).flag_bits) for n in z.namelist() if any(x in n for x in ['mu0000118','mh223','mh259'])])
          assert not missing and not different,(missing,different)
          captures=sorted(Path('delivery-captures').glob('v89-*.png'))
          assert len(captures)==37,len(captures)
          assert len([p for p in captures if 'martial-' in p.name])==30
          report={'sourceCommit':source,'sourceTree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'sourceBranch':'codex/town-interiors-mobile-v86','mainAtComparison':'bfd668d4e178fa82625d634b5a54be0e27ce30a3','candidate':True,'buildRun':37022876847,'buildJob':110890093716,'buildCompletedSeoul':'2026-10-02T23:57:38+09:00','apkArtifactId':11233149249,'nativeArtifactId':11233174312,'apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'apkBytes':apk.stat().st_size,'manifest':attrs,'trackedPackagedAssetsByteMatched':len(files),'missingAssets':missing,'mismatchedAssets':different,'generatedNativeCaptures':53,'includedV89Captures':len(captures),'captureHashes':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in captures},'verification':'Exact source full Android CI SUCCESS, nine new martial/HUD/AUTO native regressions plus all configured existing gates. 34 martial IDs reviewed:30 ACTIVE four directions,2 LINKED basic attack,2 UTILITY not independent combat casts. Native camera ratio1536x709. Source capture matting remains approximate, original quality and physical phone/user acceptance pending.','localDelivery':'Execution environment went offline after exact CI success. Immutable CI artifacts verified and packaged on Actions runner.'}
          out=Path('delivery-output');out.mkdir()
          (out/'BUILD_INFO.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          zipname=out/'PROJECT_DARK_v89_install.zip'
          with zipfile.ZipFile(zipname,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as package:
              package.write(apk,'PROJECT_DARK_v89.apk')
              package.write(out/'BUILD_INFO.json','BUILD_INFO.json')
              for p in captures:package.write(p,'verification/'+p.name)
          with zipfile.ZipFile(zipname) as package:assert package.testzip() is None
          assert zipname.stat().st_size<50*1024*1024
          report['deliveryZipBytes']=zipname.stat().st_size;report['deliveryZipSha256']=hashlib.sha256(zipname.read_bytes()).hexdigest()
          print('V89_PROOF_JSON '+json.dumps(report,ensure_ascii=False))
          (out/'VERIFICATION.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PROJECT_DARK_v89_verified_install
          path: |
            delivery-output/PROJECT_DARK_v89_install.zip
            delivery-output/VERIFICATION.json
          if-no-files-found: error
          retention-days: 14
