name: V167 Combat and town integration
on:
  push:
    branches: [codex/rucesion-coast-v157]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  town:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROJECT_DARK_SOURCE_SHA: ${{ github.sha }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      PROJECT_DARK_SIDE_BY_SIDE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Recover starter gear source manifests
        run: |
          python3 tools/collect_peasant_sources.py
          python3 - <<'PY'
          import json, pathlib, sys
          rows=json.loads(pathlib.Path('qa/peasant-sources/retrieval.json').read_text())
          need={'ml228','ml229','ml230','ms001','ms002','ms003','mh172','mh173','mh174','mw001','mw002','mw003','mw004','mw005','mw006','mw007','mw008','mw009','mw010','mu0000001','mu0000002','mu0000003'}
          got={r['identity'] for r in rows if r.get('status')=='FETCHED' and '/data/type/' in r['url']}
          missing=need-got
          print('SOURCE_REGISTRATION_FETCHED',sorted(got & need))
          print('SOURCE_REGISTRATION_MISSING',sorted(missing))
          if missing:
              sys.exit(23)
          PY
          mkdir -p app/src/main/assets/source-registration
          cp qa/peasant-sources/data/type/body/mm001.json app/src/main/assets/source-registration/mm001.json
          cp qa/peasant-sources/data/type/shoes/ml228.json app/src/main/assets/source-registration/ml228.json
          cp qa/peasant-sources/data/type/shield/ms001.json app/src/main/assets/source-registration/ms001.json
          cp qa/peasant-sources/data/type/hair/mh172.json app/src/main/assets/source-registration/mh172.json
          cp qa/peasant-sources/atlas/shoes/ml228.webp app/src/main/res/drawable-nodpi/player_shoes_ml228_source.webp
          cp qa/peasant-sources/atlas/shield/ms001.webp app/src/main/res/drawable-nodpi/player_shield_ms001_source.webp
          cp qa/peasant-sources/atlas/hair/mh172.webp app/src/main/res/drawable-nodpi/player_hat_mh172_source.webp
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          specs={'shoes':['ml228','ml229','ml230'],'shield':['ms001','ms002','ms003'],'hair':['mh172','mh173','mh174'],'weapon':['mw001','mw002','mw003','mw004','mw005','mw006','mw007','mw008','mw009','mw010'],'armor':['mu0000001','mu0000002','mu0000003']}
          assets=Path('app/src/main/assets/source-registration'); draw=Path('app/src/main/res/drawable-nodpi')
          for kind, ids in specs.items():
              for ident in ids:
                  shutil.copy(Path('qa/peasant-sources/data/type')/kind/(ident+'.json'), assets/(ident+'.json'))
                  shutil.copy(Path('qa/peasant-sources/atlas')/kind/(ident+'.webp'), draw/('equip_'+ident+'_source.webp'))
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          for ident in ('mm001','mu0000001','ml228','ms001','mh172'):
              p=Path('qa/peasant-sources/data/type')
              found=list(p.glob('*/'+ident+'.json'))
              if not found: continue
              d=json.loads(found[0].read_text())
              print('META',ident,{k:v for k,v in d.items() if k!='sprites'})
          for ident in ('mm001','mu0000001'):
              found=list(Path('qa/peasant-sources/data/type').glob('*/'+ident+'.json'))
              d=json.loads(found[0].read_text())
              for g in ('01','02','03','b','c','d','e','f'):
                  if g in d['sprites']: print('BASE_REG',ident,g,d['sprites'][g][:12])
          PY
          python3 - <<'PY'
          import json, pathlib
          for ident in ('ml228','ms001','mh172'):
              p=pathlib.Path('app/src/main/assets/source-registration')/(ident+'.json')
              d=json.loads(p.read_text())
              sprites=d['sprites']
              print('REG_MANIFEST',ident,'count',len(sprites))
              for k in list(sprites)[:12]:
                  print('REG',ident,k,sprites[k])
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Source contracts and native town service regressions
        run: |
          pip install numpy==2.3.5 Pillow==12.3.0 scipy==1.17.0
          python3 tools/validate_master.py
          gradle :app:testDebugUnitTest --tests '*EquipmentFoundationV124Test' --tests '*CombatTownV167Test' --tests '*CapturedSkillFxTest' --tests '*EquipmentPerformanceV130Test' --tests '*EquipmentStatsAndDetailsTest' --tests '*SkillAbilityRuntimeTest' --tests '*TownPropsV166Test' --tests '*TownPolishV165Test' --tests '*TownQualityV164Test' --tests '*AbelTownV152Test' --tests '*RucesionTownV154Test' --tests '*AbelIdentityPunchTravelV143Test' --tests '*TownCampaignV163Test' --tests '*NpcAppearanceTest' --tests '*QuestJournalTest' --tests '*CampaignNavigationTest' --tests '*RuntimeCheckpointTest' --tests '*RucesionServicesV156Test' --tests '*MonsterCurseV162Test' --tests '*CampaignProgressTest.definitionsKeepOriginalCurveAndAddMapLocalForestRoute' --tests '*CampaignProgressTest.newForestRouteHasOrderedAtoDObjectivesAndSafeV3Migration' --stacktrace
      - name: Record focused JUnit evidence
        if: always()
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as E
          totals=dict(tests=0,failures=0,errors=0,skipped=0)
          files=list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          for p in files:
              root=E.parse(p).getroot()
              for k in totals: totals[k]+=int(root.get(k,0))
              for case in root.findall('testcase'):
                  for tag in ('failure','error'):
                      f=case.find(tag)
                      if f is not None: print('FAILED',case.get('classname'),case.get('name'),f.get('message',''),(f.text or '')[:2500])
          print('FOCUSED_JUNIT',totals,'SUITES',len(files))
          PYTEST
      - name: Build and verify exact candidate APK
        run: |
          gradle :app:assembleDebug
          python3 tools/verify_packaged_equipment.py app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_v167_apk.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-town-v167-native-${{ github.sha }}
          path: |
            app/build/reports/combat-town-v167/
            app/build/reports/equipment-performance-v130/
            app/build/reports/town-v166/
            app/build/reports/town-v165/
            app/build/reports/town-v164/
            app/build/reports/abel-v152/
            app/build/reports/town-v163/
            app/build/reports/rucesion-v157/
            app/build/reports/coast-v158/
            app/build/reports/coast-v159/
            app/build/reports/coast-v160/
            app/build/reports/abel-v161/
            app/build/reports/curse-v162/
            app/build/reports/abel-v139/
            app/build/reports/town-v156/
            app/build/reports/town-v154/
            app/build/reports/device-review/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: combat-town-v167-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/BUILD_INFO.json

