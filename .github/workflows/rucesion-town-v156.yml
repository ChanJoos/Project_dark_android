name: V184 Horror portals (focused native + APK)
on:
  push:
    branches: [codex/rucesion-coast-v157]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  cancel-accidental-common:
    if: contains(github.event.head_commit.message, '[horror-ci-only]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel only accidental V184 common runs
        run: |
          python3 - <<'PY'
          import urllib.request,json,os
          base='https://api.github.com/repos/ChanJoos/Project_dark_android/actions/runs/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          for ident in [39102512303,39102510494]:
              run=json.load(urllib.request.urlopen(urllib.request.Request(base+str(ident),headers=headers)))
              assert run['head_sha']=='9d8344d3f9f39579bfbff7dfe9ece98db37989f8' and run['name']=='Validate PROJECT DARK Android'
              if run['status']!='completed':
                  req=urllib.request.Request(base+str(ident)+'/cancel',data=b'',headers=headers,method='POST')
                  with urllib.request.urlopen(req) as response:print('CANCEL_REQUESTED',ident,response.status)
              else:print('ALREADY_FINISHED',ident,run['conclusion'])
          PY
  town:
    if: ${{ !contains(github.event.head_commit.message, '[horror-ci-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      JAVA_TOOL_OPTIONS: '-Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2'
      PROJECT_DARK_SOURCE_SHA: ${{ github.sha }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      PROJECT_DARK_SIDE_BY_SIDE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Recover starter gear source manifests
        run: |
          python3 tools/collect_peasant_sources.py
          python3 - <<'PY'
          import json, pathlib, sys
          rows=json.loads(pathlib.Path('qa/peasant-sources/retrieval.json').read_text())
          need={'ml228','ml229','ml230','ms001','ms002','ms003','mh172','mh173','mh174','mw001','mw002','mw003','mw004','mw005','mw006','mw007','mw008','mw009','mw010','mu0000001','mu0000002','mu0000003'}
          got={r['identity'] for r in rows if r.get('status')=='FETCHED' and '/data/type/' in r['url']}
          missing=need-got
          print('SOURCE_REGISTRATION_FETCHED',sorted(got & need))
          print('SOURCE_REGISTRATION_MISSING',sorted(missing))
          if missing:
              sys.exit(23)
          PY
          mkdir -p app/src/main/assets/source-registration
          cp qa/peasant-sources/data/type/body/mm001.json app/src/main/assets/source-registration/mm001.json
          cp qa/peasant-sources/data/type/shoes/ml228.json app/src/main/assets/source-registration/ml228.json
          cp qa/peasant-sources/data/type/shield/ms001.json app/src/main/assets/source-registration/ms001.json
          cp qa/peasant-sources/data/type/hair/mh172.json app/src/main/assets/source-registration/mh172.json
          cp qa/peasant-sources/atlas/shoes/ml228.webp app/src/main/res/drawable-nodpi/player_shoes_ml228_source.webp
          cp qa/peasant-sources/atlas/shield/ms001.webp app/src/main/res/drawable-nodpi/player_shield_ms001_source.webp
          cp qa/peasant-sources/atlas/hair/mh172.webp app/src/main/res/drawable-nodpi/player_hat_mh172_source.webp
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          specs={'shoes':['ml228','ml229','ml230'],'shield':['ms001','ms002','ms003'],'hair':['mh172','mh173','mh174'],'weapon':['mw001','mw002','mw003','mw004','mw005','mw006','mw007','mw008','mw009','mw010'],'armor':['mu0000001','mu0000002','mu0000003']}
          assets=Path('app/src/main/assets/source-registration'); draw=Path('app/src/main/res/drawable-nodpi')
          for kind, ids in specs.items():
              for ident in ids:
                  shutil.copy(Path('qa/peasant-sources/data/type')/kind/(ident+'.json'), assets/(ident+'.json'))
                  shutil.copy(Path('qa/peasant-sources/atlas')/kind/(ident+'.webp'), draw/('equip_'+ident+'_source.webp'))
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          for ident in ('mm001','mu0000001','ml228','ms001','mh172'):
              p=Path('qa/peasant-sources/data/type')
              found=list(p.glob('*/'+ident+'.json'))
              if not found: continue
              d=json.loads(found[0].read_text())
              print('META',ident,{k:v for k,v in d.items() if k!='sprites'})
          for ident in ('mm001','mu0000001'):
              found=list(Path('qa/peasant-sources/data/type').glob('*/'+ident+'.json'))
              d=json.loads(found[0].read_text())
              for g in ('01','02','03','b','c','d','e','f'):
                  if g in d['sprites']: print('BASE_REG',ident,g,d['sprites'][g][:12])
          PY
          python3 - <<'PY'
          import json, pathlib
          for ident in ('ml228','ms001','mh172'):
              p=pathlib.Path('app/src/main/assets/source-registration')/(ident+'.json')
              d=json.loads(p.read_text())
              sprites=d['sprites']
              print('REG_MANIFEST',ident,'count',len(sprites))
              for k in list(sprites)[:12]:
                  print('REG',ident,k,sprites[k])
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build requested Horror preview APK
        run: |
          pip install numpy==2.3.5 Pillow==12.3.0 scipy==1.17.0
          if [[ "$(git log -1 --format=%B)" == *"[rapid-assets-only]"* ]]; then
            git fetch --depth=1 origin b300a5c3e2049e68b32a00a29b1f5396793b60d0
            while IFS= read -r changed; do
              case "$changed" in
                app/src/test/java/com/projectdark/mobile/RapidSourceV198Test.java|.github/workflows/rucesion-town-v156.yml) ;;
                *) echo "Unexpected file in asset-only validation: $changed"; exit 1 ;;
              esac
            done < <(git diff --name-only b300a5c3e2049e68b32a00a29b1f5396793b60d0 HEAD)
            gradle :app:testDebugUnitTest --tests '*RapidSourceV198Test' :app:assembleDebug --stacktrace
          elif [[ "$(git log -1 --format=%B)" == *"[inventory-tests-only]"* ]]; then
            git fetch --depth=1 origin d3695a9bd388028d2dab62cb8e5c60eb48e106d8
            while IFS= read -r changed; do
              case "$changed" in
                app/src/test/java/com/projectdark/mobile/ItemWindowReferenceTest.java|.github/workflows/rucesion-town-v156.yml) ;;
                *) echo "Unexpected production change in inventory-test validation: $changed"; exit 1 ;;
              esac
            done < <(git diff --name-only d3695a9bd388028d2dab62cb8e5c60eb48e106d8 HEAD)
            gradle :app:testDebugUnitTest --tests '*ItemWindowReferenceTest' --tests '*InventoryFeedbackV199Test' --tests '*RapidSourceV198Test' :app:assembleDebug --stacktrace
          elif [[ "$(git log -1 --format=%B)" == *"[horror-doors-only]"* ]]; then
            git fetch --depth=1 origin fa692546d720fde62c45914f763c1805b60b6849
            while IFS= read -r changed; do
              case "$changed" in
                app/src/main/java/com/projectdark/mobile/world/HorrorCastleGeometry.java|app/src/main/java/com/projectdark/mobile/HorrorCastleRenderer.java|app/src/main/java/com/projectdark/mobile/HorrorCastleLegacyRenderer.java|app/src/test/java/com/projectdark/mobile/HorrorCastleV179Test.java|app/src/test/java/com/projectdark/mobile/HorrorDoorsV200Test.java|.github/workflows/rucesion-town-v156.yml|docs/*|master/MASTER_MANIFEST.md|master/changes/V200_HORROR_DOOR_THRESHOLDS.json) ;;
                *) echo "Unexpected change in Horror doorway scope: $changed"; exit 1 ;;
              esac
            done < <(git diff --name-only fa692546d720fde62c45914f763c1805b60b6849 HEAD)
            gradle :app:testDebugUnitTest --tests '*HorrorCastleV179Test' --tests '*HorrorCastleMobileV183Test' --tests '*HorrorDoorsV200Test' :app:assembleDebug --stacktrace
          elif [[ "$(git log -1 --format=%B)" == *"[v204-regression-only]"* ]]; then
            git fetch --depth=1 origin 2a05f305473150327b765264cd86d29bf1e64636
            while IFS= read -r changed; do
              case "$changed" in
                .github/workflows/rucesion-town-v156.yml|app/src/test/java/com/projectdark/mobile/AllJobSkillSourceTest.java|app/src/test/java/com/projectdark/mobile/ClassicSkillReferenceTest.java|app/src/test/java/com/projectdark/mobile/SkillFxAuditTest.java) ;;
                *) echo "Unexpected regression-only change: $changed"; exit 1 ;;
              esac
            done < <(git diff --name-only 2a05f305473150327b765264cd86d29bf1e64636 HEAD)
            gradle :app:testDebugUnitTest --tests '*AllJobSkillSourceTest.allJobsUseProductionInputAndRenderSkillAndActualRecipientTogether' --tests '*ClassicSkillReferenceTest.productionInputSeparatesCasterAndRecipientChannelsAndNeverHealsEnemies' --tests '*SkillFxAuditTest.all221RuntimeRoutesAndFourDirectionsRenderWithoutBorrowingSources' :app:assembleDebug --stacktrace
          elif [[ "$(git log -1 --format=%B)" == *"[item-catalog-v210]"* ]]; then
            python3 tools/validate_item_catalog_v210.py
            gradle :app:testDebugUnitTest --tests '*ItemCatalogV210Test' --tests '*EquipmentFoundationV124Test' --tests '*AccessoryCatalogV125Test' --tests '*PoteRewardsV123Test' --tests '*TownInteriorTest' --tests '*ChungryongWeaponTest' --tests '*AdaptedCampaignRewardTest' --tests '*InventoryFeedbackV199Test' --tests '*ItemWindowReferenceTest' --tests '*WeaponIconsV209Test' --tests '*MineHuntV209Test' --tests '*MineHuntV208Test' --tests '*MineTownV203Test' --tests '*ScreenMagicV204Test' --tests '*HorrorCastleLoopV207Test' :app:assembleDebug --stacktrace
          elif [[ "$(git log -1 --format=%B)" == *"[mine-repair-v209]"* ]]; then
            python3 tools/validate_mine_hunt_v208.py
            gradle :app:testDebugUnitTest --tests '*MineHuntV209Test' --tests '*WeaponIconsV209Test' --tests '*MineHuntV208Test' --tests '*InventoryFeedbackV199Test' --tests '*ItemWindowReferenceTest' --tests '*MineTownV203Test' --tests '*MinePolishV206Test' --tests '*ScreenMagicV204Test' --tests '*HorrorCastleLoopV207Test' --tests '*MonsterChasePerformanceTest' :app:assembleDebug --stacktrace
          elif [[ "$(git log -1 --format=%B)" == *"[mine-hunt-v208]"* ]]; then
            python3 tools/validate_mine_hunt_v208.py
            gradle :app:testDebugUnitTest --tests '*MineHuntV208Test' --tests '*MineTownV203Test' --tests '*MinePolishV206Test' --tests '*ScreenMagicV204Test' --tests '*HorrorCastleLoopV207Test' --tests '*MonsterChasePerformanceTest' :app:assembleDebug --stacktrace
          elif [[ "$(git log -1 --format=%B)" == *"[horror-loop-v207]"* ]]; then
            gradle :app:testDebugUnitTest --tests '*HorrorCastleV179Test' --tests '*HorrorCastleMobileV183Test' --tests '*HorrorDoorsV200Test' --tests '*HorrorCastleLoopV207Test' --tests '*ScreenMagicV204Test' --tests '*MinePolishV206Test' :app:assembleDebug --stacktrace
          elif [[ "$(git log -1 --format=%B)" == *"[mine-polish-v206]"* ]]; then
            gradle :app:testDebugUnitTest --tests '*MineTownV203Test' --tests '*MinePolishV206Test' --tests '*SkillSpatialContractTest' --tests '*ScreenMagicV204Test' --tests '*TownInteriorTest' --tests '*NpcAppearanceTest' :app:assembleDebug --stacktrace
          elif [[ "$(git log -1 --format=%B)" == *"[mine-rebuild-v205]"* ]]; then
            gradle :app:testDebugUnitTest --tests '*MineTownV203Test' --tests '*ScreenMagicV204Test' --tests '*TownInteriorTest' --tests '*NpcAppearanceTest' :app:assembleDebug --stacktrace
          elif [[ "$(git log -1 --format=%B)" == *"[screen-magic-v204]"* ]]; then
            python3 tools/generate_skill_abilities.py
            git diff --exit-code -- app/src/main/assets/skills/abilities.json app/src/main/java/com/projectdark/mobile/SkillAbilityData.java docs/SKILL_ABILITY_FORMULAS.csv
            gradle :app:testDebugUnitTest --tests '*ScreenMagicV204Test' --tests '*CurseHudV202Test' --tests '*ScreenMagicV201Test' --tests '*AllSkillRuntimeV138Test' --tests '*SkillAbilityRuntimeTest' --tests '*SkillContactRegressionTest' :app:assembleDebug --stacktrace
          elif [[ "$(git log -1 --format=%B)" == *"[mine-town-only]"* ]]; then
            git fetch --depth=1 origin 3c796b66acaf7aaf9cb8efb8de06dd3f6900f532
            while IFS= read -r changed; do
              case "$changed" in
                app/src/main/java/com/projectdark/mobile/GameView.java|app/src/main/java/com/projectdark/mobile/RuntimeState.java|app/src/main/java/com/projectdark/mobile/TownTravel.java|app/src/main/java/com/projectdark/mobile/TownTravelWindow.java|app/src/main/java/com/projectdark/mobile/TownServiceLabels.java|app/src/main/java/com/projectdark/mobile/NpcIdentity.java|app/src/main/java/com/projectdark/mobile/world/CampaignWorld.java|app/src/main/java/com/projectdark/mobile/world/PoteCampaignMapDef.java|app/src/main/java/com/projectdark/mobile/world/TownInteriorDef.java|app/src/main/java/com/projectdark/mobile/world/MineTownGeometry.java|app/src/main/java/com/projectdark/mobile/world/MineTownRenderer.java|app/src/test/java/com/projectdark/mobile/MineTownV203Test.java|app/src/test/java/com/projectdark/mobile/NpcAppearanceTest.java|.github/workflows/android.yml|verification/MINE_TOWN_V203_BUILD.json|app/src/main/assets/mine-v203/*|master/source/mine_v203/*|tools/mine_v203/*|.github/workflows/rucesion-town-v156.yml|docs/*|master/MASTER_MANIFEST.md|master/changes/V203_MINE_TOWN.json) ;;
                *) echo "Unexpected Mine town scope: $changed"; exit 1 ;;
              esac
            done < <(git diff --name-only 3c796b66acaf7aaf9cb8efb8de06dd3f6900f532 HEAD)
            gradle :app:testDebugUnitTest --tests '*MineTownV203Test' --tests '*NpcAppearanceTest' --tests '*TownCampaignV163Test.allTwelveTownPairsUseRealManagerDialogAndPersistWithoutQuestOrLevelGrant' --tests '*TownInteriorTest' --tests '*CurseHudV202Test' --tests '*ScreenMagicV201Test' :app:assembleDebug --stacktrace
          elif [[ "$(git log -1 --format=%B)" == *"[curse-hud-only]"* ]]; then
            git fetch --depth=1 origin 15c6dd1d2cf9dd15b0042f625bb6b6e9eca0dbe0
            while IFS= read -r changed; do
              case "$changed" in
                app/src/main/java/com/projectdark/mobile/GameView.java|app/src/main/java/com/projectdark/mobile/SkillVfxRenderer.java|app/src/main/java/com/projectdark/mobile/CurseSkullFx.java|app/src/main/java/com/projectdark/mobile/HudMapLocation.java|app/src/test/java/com/projectdark/mobile/CurseHudV202Test.java|.github/workflows/rucesion-town-v156.yml|docs/*|master/MASTER_MANIFEST.md|master/changes/V202_CURSE_HUD.json) ;;
                *) echo "Unexpected change in curse/HUD scope: $changed"; exit 1 ;;
              esac
            done < <(git diff --name-only 15c6dd1d2cf9dd15b0042f625bb6b6e9eca0dbe0 HEAD)
            gradle :app:testDebugUnitTest --tests '*CurseHudV202Test' --tests '*ScreenMagicV201Test' --tests '*SkillPresentationTest' --tests '*SkillContactRegressionTest' --tests '*MobileHudV135Test' --tests '*MonsterCurseV162Test' --tests '*AllSkillRuntimeV138Test' :app:assembleDebug --stacktrace
          elif [[ "$(git log -1 --format=%B)" == *"[screen-magic-only]"* ]]; then
            git fetch --depth=1 origin 77596336f9e6c843a2b071b23a5d7511e08acf0c
            while IFS= read -r changed; do
              case "$changed" in
                app/src/main/java/com/projectdark/mobile/CombatResolver.java|app/src/main/java/com/projectdark/mobile/RuntimeCombatPortAdapter.java|app/src/main/java/com/projectdark/mobile/RuntimeCombatSession.java|app/src/main/java/com/projectdark/mobile/RuntimeState.java|app/src/main/java/com/projectdark/mobile/MonsterAIController.java|app/src/main/java/com/projectdark/mobile/SkillAbilityExecutor.java|app/src/main/java/com/projectdark/mobile/GameView.java|app/src/test/java/com/projectdark/mobile/ScreenMagicV201Test.java|.github/workflows/rucesion-town-v156.yml|docs/*|master/MASTER_MANIFEST.md|master/changes/V201_SCREEN_MAGIC_AGGRO.json) ;;
                *) echo "Unexpected change in screen-magic scope: $changed"; exit 1 ;;
              esac
            done < <(git diff --name-only 77596336f9e6c843a2b071b23a5d7511e08acf0c HEAD)
            gradle :app:testDebugUnitTest --tests '*ScreenMagicV201Test' --tests '*SkillSpatialContractTest' --tests '*AllSkillRuntimeV138Test' --tests '*SkillAbilityRuntimeTest' --tests '*PoteMonsterPlayableRuntimeTest' --tests '*MonsterChasePerformanceTest' --tests '*AbelCombatV153Test' --tests '*SkillContactRegressionTest' --tests '*HorrorCastleMobileV183Test' :app:assembleDebug --stacktrace
          else
            gradle :app:testDebugUnitTest --tests '*HorrorCastleMobileV183Test' --tests '*HorrorEquipmentV184Test' --tests '*LinkedItemCatalogV185Test' --tests '*LinkedClothingV186Test' --tests '*LinkedFoodV187Test' --tests '*SparseWeaponV188Test' --tests '*LinkedAccessoryV189Test' --tests '*MaleVillageClothingV190Test' --tests '*LinkedBeltV191Test' --tests '*FemaleVillageClothingV192Test' --tests '*LinkedAccessoryV193Test' --tests '*LinkedStaffV194Test' --tests '*RecoveredWeaponV195Test' --tests '*ExpandedVillageClothingV197Test' --tests '*InventoryFeedbackV199Test' --tests '*RapidSourceV198Test' --tests '*ItemWindowReferenceTest' --tests '*AccessoryCatalogV125Test' --tests '*LeapPlacementV184Test' --tests '*HorrorCastleV179Test' --tests '*SkillPresentationTest' --tests '*Martial*Test' :app:assembleDebug --stacktrace
          fi
          mkdir -p delivery
          cp app/build/outputs/apk/debug/app-debug.apk delivery/PROJECT_DARK_v184_portals.apk
          python3 - <<'PY'
          import zipfile,json,hashlib,os,datetime,subprocess
          from pathlib import Path
          from zoneinfo import ZoneInfo
          p=Path('delivery/PROJECT_DARK_v184_portals.apk')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              identity=json.loads(z.read('assets/build_identity.json'))
              assert identity['sourceCommit']==os.environ['GITHUB_SHA']
              assert identity['versionCode']==184
              entries=z.namelist()
              assert len([n for n in entries if n.startswith('assets/horror-v180/') and n.endswith('.png')])>=647
          report=dict(sourceCommit=os.environ['GITHUB_SHA'],runId=os.environ['GITHUB_RUN_ID'],builtAtKST=datetime.datetime.now(ZoneInfo('Asia/Seoul')).isoformat(),apkSha256=hashlib.sha256(p.read_bytes()).hexdigest(),apkBytes=p.stat().st_size,identity=identity,scope=('V210 original item identity catalog, synthetic aliases retired, packed original inventory atlas, exact legacy inventory/equipment/bank migration and one-time grants; source-only wearable poses and handset remain unverified' if '[item-catalog-v210]' in subprocess.check_output(['git','log','-1','--format=%B'],text=True) else 'V208/V209 source-backed mine2102, ten native appearances, Mine NPC travel, shared combat, direct armor/axe/dagger inventory rewards, cache and save regressions; original server stats and full-map current-version parity unresolved; handset pending' if any(marker in subprocess.check_output(['git','log','-1','--format=%B'],text=True) for marker in ('[mine-hunt-v208]','[mine-repair-v209]')) else 'Legacy focused Android runtime; inspect source-specific verification receipt'))
          Path('delivery/build_evidence.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PY
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose delivery/PROJECT_DARK_v184_portals.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ contains(github.event.head_commit.message, '[item-catalog-v210]') && 'PROJECT_DARK_V210_ITEM_CATALOG' || contains(github.event.head_commit.message, '[mine-repair-v209]') && 'PROJECT_DARK_V209_MINE_REPAIR' || contains(github.event.head_commit.message, '[mine-hunt-v208]') && 'PROJECT_DARK_V208_MINE' || 'PROJECT_DARK_v184_portals' }}
          path: |
            delivery/
            app/build/reports/horror-v179/
            app/build/test-results/
