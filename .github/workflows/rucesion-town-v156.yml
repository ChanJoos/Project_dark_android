            python3 tools/generate_skill_presentation.py
            python3 tools/generate_skill_abilities.py
            git diff --exit-code -- app/src/main/assets/skills app/src/main/assets/skill-presentation app/src/main/java/com/projectdark/mobile/SkillActionData.java app/src/main/java/com/projectdark/mobile/SkillAbilityData.java docs/SKILL_PRESENTATION_MAPPING.csv docs/SKILL_ABILITY_FORMULAS.csv docs/SKILL_ACTION_DECISIONS.csv
