name: V110 guided onboarding and exact APK
on:
  push:
    branches: [codex/town-interiors-mobile-v86]
    paths: ['app/**', 'assets/pote/production/pote_monsters_generated_v1/sprites/campaign_v1/**', '.github/workflows/campaign-review.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_DARK_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify five-job onboarding, actual learning/shop input and retained V109 behavior
        run: |
          python3 tools/validate_master.py
          gradle :app:testDebugUnitTest --tests com.projectdark.mobile.OnboardingUiTest --tests com.projectdark.mobile.DeviceQuestRegressionTest --tests com.projectdark.mobile.SkillAbilityRuntimeTest --tests com.projectdark.mobile.SkillTestModeTest --tests com.projectdark.mobile.DevicePresentationRepairTest --tests com.projectdark.mobile.HudTouchAcceptanceTest --tests com.projectdark.mobile.NpcAppearanceTest --tests com.projectdark.mobile.ItemWindowReferenceTest --tests com.projectdark.mobile.ModernUiTest --tests com.projectdark.mobile.CampaignProgressTest --tests com.projectdark.mobile.CampaignQuickQuestIntegrationTest --tests com.projectdark.mobile.CampaignNavigationTest --tests com.projectdark.mobile.CampaignUiTest --tests com.projectdark.mobile.ChungryongWeaponTest --tests com.projectdark.mobile.ReferenceWarriorTest --tests com.projectdark.mobile.QuickQuestLatencyTest --tests com.projectdark.mobile.MillesMousePresentationTest --tests com.projectdark.mobile.InnSourceRepairTest --tests com.projectdark.mobile.world.WorldMoveTargetControllerPathTest --tests com.projectdark.mobile.world.F5mProductionQuickQuestRouteTest --tests com.projectdark.mobile.QuestJournalTest --stacktrace
      - name: Build exact source APK
        run: |
          gradle :app:assembleDebug --stacktrace
          python3 tools/verify_packaged_equipment.py app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_v110_apk.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-native-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/campaign/
            app/build/reports/device-review/*
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/BUILD_INFO.json
          if-no-files-found: error
      - name: Publish verified candidate download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="candidate-v110-${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp app/build/outputs/apk/debug/app-debug.apk PROJECT_DARK_V110.apk
          gh release create "$tag" PROJECT_DARK_V110.apk app/build/outputs/apk/debug/BUILD_INFO.json --target "$GITHUB_SHA" --prerelease --title 'PROJECT DARK V110 단계별 학습 퀘스트 · Lv11 성장 · 모험 일지 후보' --notes "기본 직업 선택 뒤 능력치 배분·기술 습득·퀵슬롯 등록·실습·장비 구매/장착·HP/MP 물약 구매/사용·판매·자동 사냥·숲길 답사를 분리. 새 캐릭터의 필수 학습 종료는 원래 경험치표의 Lv11(378000 EXP). 기존 V109 저장은 레벨·아이템·퀘스트 진행을 유지. 실제 입력·5직업 진행·저장 복원·V109 동작 회귀·정확한 APK 패키지 검증 통과. Exact source $GITHUB_SHA. Physical phone and user visual acceptance of V110 pending."
