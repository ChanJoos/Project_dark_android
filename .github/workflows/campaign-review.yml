name: Lv40 campaign native review and exact APK
on:
  push:
    branches: [codex/town-interiors-mobile-v86]
    paths: ['app/**', 'assets/pote/production/pote_monsters_generated_v1/sprites/campaign_v1/**', '.github/workflows/campaign-review.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify source-aware repair, all affected UI routes and retained Lv40 progression
        run: |
          python3 tools/validate_master.py
          gradle :app:testDebugUnitTest --tests com.projectdark.mobile.DevicePresentationRepairTest --tests com.projectdark.mobile.HudTouchAcceptanceTest --tests com.projectdark.mobile.NpcAppearanceTest --tests com.projectdark.mobile.ItemWindowReferenceTest --tests com.projectdark.mobile.ModernUiTest --tests com.projectdark.mobile.CampaignProgressTest --tests com.projectdark.mobile.CampaignQuickQuestIntegrationTest --tests com.projectdark.mobile.CampaignNavigationTest --tests com.projectdark.mobile.CampaignUiTest --tests com.projectdark.mobile.ChungryongWeaponTest --tests com.projectdark.mobile.ReferenceWarriorTest --tests com.projectdark.mobile.QuickQuestLatencyTest --tests com.projectdark.mobile.MillesMousePresentationTest --tests com.projectdark.mobile.InnSourceRepairTest --tests com.projectdark.mobile.world.WorldMoveTargetControllerPathTest --tests com.projectdark.mobile.world.F5mProductionQuickQuestRouteTest --tests com.projectdark.mobile.QuestJournalTest --stacktrace
      - name: Build exact source APK
        run: |
          gradle :app:assembleDebug --stacktrace
          python3 tools/verify_packaged_equipment.py app/build/outputs/apk/debug/app-debug.apk
      - name: Record exact build identity
        run: |
          python3 - <<'PY'
          import json,os,pathlib,hashlib,datetime
          out=pathlib.Path('app/build/outputs/apk/debug')
          apk=out/'app-debug.apk'
          info={'sourceCommit':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'candidate':True,'versionCode':108,'versionName':'1.08-quest-runtime-fixes','apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'apkBytes':apk.stat().st_size,'builtSeoul':datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(),'scope':'Exact-source V107 reference gear and carry regression plus V108 quickquest auto-attack and Shortblade quest-count fixes; quest progression, journal, navigation, UI/NPC/Lv40 regressions. Actual APK47-file restoration hash gate. Physical phone and user visual acceptance pending.','phoneAcceptance':'PENDING','userVisualAcceptance':'PENDING'}
          (out/'BUILD_INFO.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-native-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/campaign/
            app/build/reports/device-review/*
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/BUILD_INFO.json
          if-no-files-found: error
      - name: Publish verified candidate download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="candidate-v108-${GITHUB_SHA:0:8}"
          cp app/build/outputs/apk/debug/app-debug.apk PROJECT_DARK_V108.apk
          gh release create "$tag" PROJECT_DARK_V108.apk app/build/outputs/apk/debug/BUILD_INFO.json --target "$GITHUB_SHA" --prerelease --title 'PROJECT DARK V108 퀘스트 동작 수정 후보' --notes "몬스터 사냥 퀵퀘스트 자동공격 활성화와 전사 숏블레이드 사용 퀘스트 카운트 수정. Exact source $GITHUB_SHA; all configured quest/runtime regression tests and exact APK package verification passed. Physical phone and user visual acceptance pending."
