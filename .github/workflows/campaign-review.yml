name: Lv40 campaign native review and exact APK
on:
  push:
    branches: [codex/town-interiors-mobile-v86]
    paths: ['app/**', 'assets/pote/production/pote_monsters_generated_v1/sprites/campaign_v1/**', '.github/workflows/campaign-review.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify source-aware repair, all affected UI routes and retained Lv40 progression
        run: |
          python3 tools/validate_master.py
          gradle :app:testDebugUnitTest --tests com.projectdark.mobile.DevicePresentationRepairTest --tests com.projectdark.mobile.HudTouchAcceptanceTest --tests com.projectdark.mobile.NpcAppearanceTest --tests com.projectdark.mobile.ItemWindowReferenceTest --tests com.projectdark.mobile.ModernUiTest --tests com.projectdark.mobile.CampaignProgressTest --tests com.projectdark.mobile.CampaignNavigationTest --tests com.projectdark.mobile.CampaignUiTest --stacktrace
      - name: Build exact source APK
        run: |
          gradle :app:assembleDebug --stacktrace
          python3 tools/verify_packaged_equipment.py app/build/outputs/apk/debug/app-debug.apk
      - name: Record exact build identity
        run: |
          python3 - <<'PY'
          import json,os,pathlib,hashlib,datetime
          out=pathlib.Path('app/build/outputs/apk/debug')
          apk=out/'app-debug.apk'
          info={'sourceCommit':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'candidate':True,'versionCode':106,'versionName':'1.06-equipment-npc-repair','apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'apkBytes':apk.stat().st_size,'builtSeoul':datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(),'scope':'Affected repair/UI/NPC/Lv40 tests on exact source; unchanged remaining regression cases passed in full 251-case run37261714320 (two stale expectations corrected here). Runtime source and assets unchanged from b8353728. Actual APK47-file hash gate. Phone pending.','phoneAcceptance':'PENDING','userVisualAcceptance':'PENDING'}
          (out/'BUILD_INFO.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-native-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/campaign/
            app/build/reports/device-review/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/BUILD_INFO.json
          if-no-files-found: error
      - name: Publish verified candidate download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="candidate-v106-${GITHUB_SHA:0:8}"
          cp app/build/outputs/apk/debug/app-debug.apk PROJECT_DARK_V106.apk
          gh release create "$tag" PROJECT_DARK_V106.apk app/build/outputs/apk/debug/BUILD_INFO.json --target "$GITHUB_SHA" --prerelease --title 'PROJECT DARK V106 Lv40 성장 후보' --notes "V105 장비 원본 누락 복구, 기존 메뉴 아이콘과 동일 간격 복원, NPC 한글 이름 및 좌측 하단 정지 포즈. Exact source $GITHUB_SHA; affected repair/UI/NPC/Lv40 regression passed; unchanged full-suite cases verified separately. Physical phone and user visual acceptance pending."
