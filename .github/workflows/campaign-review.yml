name: V109 device regressions and exact APK
on:
  push:
    branches: [codex/town-interiors-mobile-v86]
    paths: ['app/**', 'assets/pote/production/pote_monsters_generated_v1/sprites/campaign_v1/**', '.github/workflows/campaign-review.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_DARK_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Reproduce all four reported paths on the rejected V108 source
        run: |
          git fetch --no-tags --depth=1 origin c48cd39d33aae4c608d122b1257518cbaf3ec828
          baseline="$RUNNER_TEMP/project-dark-v108-baseline"
          git worktree add --detach "$baseline" c48cd39d33aae4c608d122b1257518cbaf3ec828
          cp app/src/test/java/com/projectdark/mobile/DeviceQuestRegressionTest.java "$baseline/app/src/test/java/com/projectdark/mobile/"
          set +e
          gradle -p "$baseline" :app:testDebugUnitTest --tests com.projectdark.mobile.DeviceQuestRegressionTest --stacktrace
          result=$?
          set -e
          test "$result" -ne 0
          BASELINE_PATH="$baseline" python3 - <<'PYBASELINE'
          import os,pathlib,xml.etree.ElementTree as ET
          p=pathlib.Path(os.environ['BASELINE_PATH'])/'app/build/test-results/testDebugUnitTest/TEST-com.projectdark.mobile.DeviceQuestRegressionTest.xml'
          root=ET.parse(p).getroot()
          cases=list(root.iter('testcase'))
          assert len(cases)==4, ET.tostring(root).decode()[:1000]
          for case in cases:
              failure=case.find('failure')
              assert failure is not None and case.find('error') is None, case.attrib
              assert failure.attrib.get('type')=='java.lang.AssertionError', failure.attrib
              print('REPRODUCED_V108_FAIL',case.attrib['name'],failure.attrib.get('message'))
          PYBASELINE
      - name: Verify source-aware repair, all affected UI routes and retained Lv40 progression
        run: |
          python3 tools/validate_master.py
          gradle :app:testDebugUnitTest --tests com.projectdark.mobile.DeviceQuestRegressionTest --tests com.projectdark.mobile.SkillAbilityRuntimeTest --tests com.projectdark.mobile.SkillTestModeTest --tests com.projectdark.mobile.DevicePresentationRepairTest --tests com.projectdark.mobile.HudTouchAcceptanceTest --tests com.projectdark.mobile.NpcAppearanceTest --tests com.projectdark.mobile.ItemWindowReferenceTest --tests com.projectdark.mobile.ModernUiTest --tests com.projectdark.mobile.CampaignProgressTest --tests com.projectdark.mobile.CampaignQuickQuestIntegrationTest --tests com.projectdark.mobile.CampaignNavigationTest --tests com.projectdark.mobile.CampaignUiTest --tests com.projectdark.mobile.ChungryongWeaponTest --tests com.projectdark.mobile.ReferenceWarriorTest --tests com.projectdark.mobile.QuickQuestLatencyTest --tests com.projectdark.mobile.MillesMousePresentationTest --tests com.projectdark.mobile.InnSourceRepairTest --tests com.projectdark.mobile.world.WorldMoveTargetControllerPathTest --tests com.projectdark.mobile.world.F5mProductionQuickQuestRouteTest --tests com.projectdark.mobile.QuestJournalTest --stacktrace
      - name: Build exact source APK
        run: |
          gradle :app:assembleDebug --stacktrace
          python3 tools/verify_packaged_equipment.py app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_v109_apk.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-native-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/campaign/
            app/build/reports/device-review/*
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/BUILD_INFO.json
          if-no-files-found: error
      - name: Publish verified candidate download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="candidate-v109-${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp app/build/outputs/apk/debug/app-debug.apk PROJECT_DARK_V109.apk
          gh release create "$tag" PROJECT_DARK_V109.apk app/build/outputs/apk/debug/BUILD_INFO.json --target "$GITHUB_SHA" --prerelease --title 'PROJECT DARK V109 기기 기본설정 퀘스트·레스큐 수정 후보' --notes "기본 테스트 ON 상태와 저장/재시작에서 여관·성장 퀵퀘스트 자동 공격, 숏블레이드 3회, 피해 없는 근접 레스큐 도발, 37.5% 작은 쥐 검증. 이전 V108 소스의 네 회귀 실패를 재현한 뒤 현재 소스가 모두 통과. Exact source $GITHUB_SHA; all configured quest/runtime regression tests and exact APK package verification passed. Physical phone and user visual acceptance pending."
