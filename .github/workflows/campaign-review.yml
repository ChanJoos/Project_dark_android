name: Lv40 campaign native review and exact APK
on:
  push:
    branches: [codex/town-interiors-mobile-v86]
    paths: ['app/**', 'assets/pote/production/pote_monsters_generated_v1/sprites/campaign_v1/**', '.github/workflows/campaign-review.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Source data and complete regression gate
        run: |
          python3 tools/validate_master.py
          gradle :app:testDebugUnitTest --stacktrace
      - name: Build exact source APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Record exact build identity
        run: |
          python3 - <<'PY'
          import json,os,pathlib,hashlib,datetime
          out=pathlib.Path('app/build/outputs/apk/debug')
          apk=out/'app-debug.apk'
          info={'sourceCommit':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'candidate':True,'versionCode':105,'versionName':'1.05-lv40-progression','apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'apkBytes':apk.stat().st_size,'builtSeoul':datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(),'scope':'Full JVM/native regression; five normal Resolver/resource progression simulations to Lv40, 23 quests per class; all campaign NPC/species/gate paths; actual input and cold restart. Placement fixtures are not a phone end-to-end run.','phoneAcceptance':'PENDING','userVisualAcceptance':'PENDING'}
          (out/'BUILD_INFO.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-native-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/campaign/
            app/build/reports/device-review/v105-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/BUILD_INFO.json
          if-no-files-found: error
      - name: Publish verified candidate download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="candidate-v105-${GITHUB_SHA:0:8}"
          cp app/build/outputs/apk/debug/app-debug.apk PROJECT_DARK_V105.apk
          gh release create "$tag" PROJECT_DARK_V105.apk app/build/outputs/apk/debug/BUILD_INFO.json --target "$GITHUB_SHA" --prerelease --title 'PROJECT DARK V105 Lv40 성장 후보' --notes "공통20 + 직업별3 의뢰, 포테4구역과 피에트, 직업별 장비/실습, 보급/휴식/저장. Exact source $GITHUB_SHA; full configured regression passed; normal combat progression simulation passed. Physical phone and user visual acceptance pending."
