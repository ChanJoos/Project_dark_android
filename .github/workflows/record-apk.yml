name: Record installed APK
on:
  push:
    branches: [dot/apk-recording-20261020]
    paths: ['.github/workflows/record-apk.yml']
permissions:
  contents: read
  actions: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_PACKAGE: 'com.projectdark.mobile.v266test.canvas'
      SOURCE_RUN: '40080774752'
      SOURCE_SHA: '912ec0352491327ac249c28e7aad2e1b9cca1be0'
      SOURCE_ARTIFACT: '12555515890'
      APK_SHA256: '32e302b346e7bdb2d20ac10adef7fa63552d64792f44394526859b08fb5e9c42'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate source run before downloading its APK
        run: |
          mkdir -p evidence input
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > evidence/source-run.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('evidence/source-run.json'))
          assert r['head_sha']==os.environ['SOURCE_SHA']
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_repository']['full_name']==os.environ['GH_REPO']
          PY
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/artifacts" > evidence/source-artifacts.json
          gh run download "$SOURCE_RUN" --repo "$GH_REPO" --name PROJECT_DARK_MINE_ENTRY_CANDIDATE --dir input
          python3 - <<'PY'
          import pathlib, json, hashlib, zipfile, os
          artifacts=json.load(open('evidence/source-artifacts.json'))['artifacts']
          selected=[a for a in artifacts if str(a['id'])==os.environ['SOURCE_ARTIFACT']]
          assert len(selected)==1 and not selected[0]['expired']
          assert selected[0]['name']=='PROJECT_DARK_MINE_ENTRY_CANDIDATE'
          apks=list(pathlib.Path('input').rglob('*.apk'))
          assert len(apks)==1, apks
          p=apks[0]
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['APK_SHA256']
          with zipfile.ZipFile(p) as z:
              identity=json.loads(z.read('assets/build_identity.json'))
          assert identity['sourceCommit']==os.environ['SOURCE_SHA']
          assert str(identity['runId'])==os.environ['SOURCE_RUN']
          proof={'identity':identity,'apkSha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                 'capture':'installed APK on Android emulator; not a handset recording',
                 'scope':'Mine-entry fix candidate, real class setup and input capture; inspect outcomes; development skill-test mode disclosed',
                 'audio':False}
          pathlib.Path('evidence/apk-identity.json').write_text(json.dumps(proof,indent=2))
          pathlib.Path('input/app.apk').write_bytes(p.read_bytes())
          PY
      - name: Verify and download isolated software Canvas APK
        run: |
          mkdir -p canvas-input
          gh api repos/$GH_REPO/actions/runs/40101239996 > evidence/canvas-source-run.json
          gh api repos/$GH_REPO/actions/runs/40101239996/artifacts > evidence/canvas-artifacts.json
          gh run download 40101239996 --repo "$GH_REPO" --name PROJECT_DARK_SOFTWARE_CANVAS_PILOT --dir canvas-input
          python3 - <<'PYCANVAS'
          import json,pathlib,hashlib,zipfile
          run=json.load(open('evidence/canvas-source-run.json'))
          assert run['head_sha']=='975fba1e05bdba0671c4b5ddf9d6186189b03da1'
          assert run['status']=='completed' and run['conclusion']=='success'
          artifacts=json.load(open('evidence/canvas-artifacts.json'))['artifacts']
          assert any(a['id']==12562684024 and a['name']=='PROJECT_DARK_SOFTWARE_CANVAS_PILOT' and not a['expired'] for a in artifacts)
          apks=list(pathlib.Path('canvas-input').rglob('*.apk'))
          assert len(apks)==1
          raw=apks[0].read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='c52fefdbd4cb9b2123c13b6ecdb35e56949e10426d51759c13f8a763547d4e9d'
          with zipfile.ZipFile(apks[0]) as z:
              identity=json.loads(z.read('assets/build_identity.json'))
          assert identity['sourceCommit']=='975fba1e05bdba0671c4b5ddf9d6186189b03da1'
          assert str(identity['runId'])=='40101239996'
          pathlib.Path('input/canvas.apk').write_bytes(raw)
          pathlib.Path('evidence/canvas-identity.json').write_text(json.dumps(identity,indent=2))
          PYCANVAS
      - name: Prepare Android emulator using official SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # Never accept a new license implicitly; EOF declines any new prompt.
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' </dev/null
          test -f "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/package.xml"
          test -x "$ANDROID_HOME/emulator/emulator"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | avdmanager create avd -n apk-capture -p "$ANDROID_AVD_HOME/apk-capture.avd" -k 'system-images;android-35;google_apis;x86_64' --force
          find "$RUNNER_TEMP" -name 'apk-capture.ini' -o -name 'config.ini' > evidence/avd-paths.txt
          printf '\nhw.lcd.width=720\nhw.lcd.height=1280\nhw.lcd.density=240\nhw.cpu.ncore=2\n' >> "$ANDROID_AVD_HOME/apk-capture.avd/config.ini"
          emulator -list-avds | tee evidence/avd-list.txt
          grep -qx apk-capture evidence/avd-list.txt
          # Official Ubuntu runtime dependencies, unpacked locally without root changes.
          mkdir -p "$RUNNER_TEMP/emulator-libs/packages" "$RUNNER_TEMP/emulator-libs/root"
          (cd "$RUNNER_TEMP/emulator-libs/packages" && apt-get download libpulse0 libasyncns0 libsndfile1 libflac12t64 libogg0 libopus0 libvorbis0a libvorbisenc2 libmpg123-0t64 libmp3lame0)
          for deb in "$RUNNER_TEMP/emulator-libs/packages/"*.deb; do dpkg-deb -x "$deb" "$RUNNER_TEMP/emulator-libs/root"; done
          export LD_LIBRARY_PATH="$RUNNER_TEMP/emulator-libs/root/usr/lib/x86_64-linux-gnu:$RUNNER_TEMP/emulator-libs/root/usr/lib/x86_64-linux-gnu/pulseaudio:${LD_LIBRARY_PATH:-}"
          emulator -version > evidence/emulator-version.txt 2>&1
          # User approved only current account access in this ephemeral runner.
          getfacl /dev/kvm > evidence/kvm-acl-before.txt
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          getfacl /dev/kvm > evidence/kvm-acl-after.txt
          emulator -accel-check > evidence/acceleration.txt 2>&1
          emulator -avd apk-capture -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -accel on -memory 4096 > evidence/emulator.log 2>&1 &
          EMULATOR_PID=$!
          sleep 5
          kill -0 "$EMULATOR_PID" || { cat evidence/emulator.log; exit 1; }
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do sleep 2; done'
          adb shell input keyevent 82
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
      - name: Install exact artifact and record real running app
        run: |
          adb install -r input/canvas.apk | tee evidence/install.txt
          adb shell pm list packages | grep projectdark | tee evidence/packages.txt
          PKG=com.projectdark.mobile.v266test.canvas
          adb shell pm path "$PKG" | tee evidence/installed-path.txt
          adb shell am start -W -n "$PKG/com.projectdark.mobile.MainActivity" | tee evidence/launch.txt
          sleep 8
          # Dismiss the observed Android first-run fullscreen tutorial, not a permission dialog.
          sleep 20
          # Only explicit dedicated filming profiles, never a user's save.
          mkdir -p profiles
          gh run download "$SOURCE_RUN" --repo "$GH_REPO" --name DEDICATED_FILMING_PROFILES --dir profiles
          test -f profiles/ROGUE/provenance.json
          cp profiles/ROGUE/provenance.json evidence/rogue-profile-provenance.json
          cp profiles/MAGE/provenance.json evidence/mage-profile-provenance.json
          python3 - <<'PYVERIFY'
          import json
          a=json.load(open('evidence/source-artifacts.json'))['artifacts']
          assert any(str(x['id'])=='12555401353' and x['name']=='DEDICATED_FILMING_PROFILES' for x in a)
          for job in ('ROGUE','MAGE'):
              p=json.load(open('profiles/'+job+'/provenance.json'))
              assert p['job']==job and p['level']==99 and p['firstAdvanced'] is True
              assert all(p[k]==1000000 for k in ('currentHp','maxHp','currentMp','maxMp'))
              assert p['auto'] is False
          PYVERIFY
          # Restore only canonical authorized all255 dedicated test character.
          adb shell am force-stop "$PKG"
          gh run download 40103632597 --repo "$GH_REPO" --name gameplay-40103632597-stage-17 --dir recorded-checkpoint
          python3 - <<'PYCHECKPOINT'
          import pathlib,hashlib,tarfile,xml.etree.ElementTree as ET
          p=pathlib.Path('recorded-checkpoint/test-profile-readonly.tar')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='ef0d9a90506ec7ed9c84daea531ec4a322e9a66c22bc2422fd335bcefeebc36f'
          out=pathlib.Path('recorded-profile/shared_prefs');out.mkdir(parents=True)
          names=['project_dark_f5m_v1.xml','project_dark_skill_book_v1.xml','project_dark_skill_test_v1.xml','project_dark_visual_v1.xml','project_dark_quick_items_v254.xml']
          with tarfile.open(p) as t:
              for name in names:
                  raw=t.extractfile('shared_prefs/'+name).read()
                  ET.fromstring(raw)
                  (out/name).write_bytes(raw)
          root=ET.parse(out/'project_dark_f5m_v1.xml').getroot()
          values={x.attrib['name']:x.attrib.get('value',x.text) for x in root}
          assert values['map_id']=='MAP_MINE_HUNT_3'
          assert float(values['player_x'])==6728 and float(values['player_y'])==2272
          pathlib.Path('evidence/checkpoint-provenance.json').write_text('{"run":40103632597,"artifact":12563873812,"stage":17,"scope":"Actual prior Android rogue checkpoint; no stat or progression edits. Monster scene reload is a new take."}')
          PYCHECKPOINT
          tar -C recorded-profile -cf - shared_prefs | adb exec-in run-as "$PKG" tar -xf -
          adb shell am start -W -n "$PKG/com.projectdark.mobile.MainActivity"
          sleep 5
          adb shell am force-stop com.google.android.apps.nexuslauncher
          adb shell input tap 927 285
          sleep 2
          adb shell pidof "$PKG" | tee evidence/pid-before.txt
          adb shell dumpsys activity activities > evidence/activity.txt
          adb exec-out screencap -p > evidence/start.png
          mkdir -p evidence/boot
          cp evidence/start.png evidence/boot/start.png
          cp evidence/canvas-identity.json evidence/boot/apk-identity.json
          adb shell input keyevent KEYCODE_HOME
      - name: Upload boot checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-${{ github.run_id }}-boot
          path: evidence/boot/
          retention-days: 7
      - name: Prepare bounded input controller
        run: |
          cat > capture_stage.py <<'PYCODE'
          import base64, json, os, pathlib, subprocess, time
          stage=int(os.environ['CAPTURE_STAGE'])
          root=pathlib.Path('evidence')/f'stage-{stage:02d}'
          root.mkdir(parents=True,exist_ok=True)
          pkg=pathlib.Path('current-package.txt').read_text().strip() if pathlib.Path('current-package.txt').exists() else os.environ['APP_PACKAGE']
          
          activity=pathlib.Path('current-activity.txt').read_text().strip() if pathlib.Path('current-activity.txt').exists() else 'com.projectdark.mobile.MainActivity'
          def run(*args,check=True):
              return subprocess.run(list(args),check=check,capture_output=True)
          def adb(*args,check=True): return run('adb',*args,check=check)
          def snap(name):
              (root/(name+'.png')).write_bytes(adb('exec-out','screencap','-p').stdout)
          
          if pathlib.Path('capture-finished').exists():
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('finished=true\n')
              raise SystemExit(0)
          
          start=time.monotonic(); control=None
          while time.monotonic()-start<240:
              raw=run('gh','api',f'repos/{os.environ["GH_REPO"]}/contents/.github/capture-controls.json?ref=dot%2Fapk-recording-20261020',check=False)
              if raw.returncode==0:
                  try:
                      info=json.loads(raw.stdout); value=json.loads(base64.b64decode(info['content']))
                      if value.get('stage')==stage:control=value;break
                  except (ValueError,KeyError):pass
              time.sleep(5)
          if control is None:raise RuntimeError(f'No approved control for stage {stage} within 240 seconds')
          (root/'control.json').write_text(json.dumps(control,ensure_ascii=False,indent=2))
          if control.get('finish') is True:
              pathlib.Path('capture-finished').touch()
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('finished=true\n')
              raise SystemExit(0)
          commands=control.get('commands',[])
          assert isinstance(commands,list) and len(commands)<=80
          allowed={'tap','swipe','wait','snapshot','launch','load_filming_profile','launch_encounter'}
          for c in commands:
              assert isinstance(c,dict) and c.get('op') in allowed
              for k in ('x','y','x2','y2'):
                  if k in c:assert type(c[k]) is int and 0<=c[k]<=1920
              if 'seconds' in c:assert isinstance(c['seconds'],(int,float)) and 0<=c['seconds']<=90
              if c.get('op') in ('load_filming_profile',):assert c.get('job') in ('ROGUE','MAGE')
              if 'ms' in c:assert type(c['ms']) is int and 100<=c['ms']<=10000
          (root/'package.txt').write_text(pkg)
          prior=pathlib.Path('last-app-pid.txt')
          current=adb('shell','pidof',pkg).stdout.decode().strip()
          if prior.exists(): assert current==prior.read_text().strip(), 'App process changed; do not claim continuous pull'
          adb('shell','am','start','-W','-f','0x20000000','-n',pkg+'/'+activity)
          time.sleep(0.4)
          snap('start')
          video=f'/sdcard/stage-{stage:02d}.mp4'
          rec=subprocess.Popen(['adb','shell','screenrecord','--size','1280x720','--bit-rate','4000000','--time-limit','150',video],stdout=(root/'record.log').open('wb'),stderr=subprocess.STDOUT)
          time.sleep(1)
          try:
              begun=time.monotonic()
              for index,c in enumerate(commands):
                  if time.monotonic()-begun>135:raise RuntimeError('Capture stage exceeded bounded duration')
                  op=c['op']
                  if op=='tap':adb('shell','input','tap',str(round(c['x']*4/3)),str(round(c['y']*4/3)))
                  elif op=='swipe':adb('shell','input','swipe',str(round(c['x']*4/3)),str(round(c['y']*4/3)),str(round(c['x2']*4/3)),str(round(c['y2']*4/3)),str(c.get('ms',1000)))
                  elif op=='wait':time.sleep(c.get('seconds',1))
                  elif op=='snapshot':snap(f'checkpoint-{index:02d}')
                  elif op=='launch':adb('shell','am','start','-W','-f','0x20000000','-n',pkg+'/'+activity)
                  elif op=='launch_encounter':
                      activity='com.projectdark.mobile.CaptureEncounterActivity'
                      pathlib.Path('current-activity.txt').write_text(activity)
                      adb('shell','am','start','-W','-f','0x20000000','-n',pkg+'/'+activity)
                      time.sleep(1)
                      report=adb('exec-out','run-as',pkg,'cat','files/capture-encounter.json').stdout
                      proof=json.loads(report)
                      assert proof.get('count')==15 and len(proof.get('monsters',[]))==15
                      assert len({m['id'] for m in proof['monsters']})==15 and all(m['hp']>0 for m in proof['monsters'])
                      (root/'actual-android-encounter.json').write_bytes(report)
                  elif op=='load_filming_profile':
                      activity='com.projectdark.mobile.MainActivity'
                      pathlib.Path('current-activity.txt').write_text(activity)
                      job=c['job']
                      adb('shell','am','force-stop',pkg)
                      adb('shell','pm','clear',pkg)
                      packed=run('tar','-C','profiles/'+job,'-cf','-','shared_prefs').stdout
                      subprocess.run(['adb','exec-in','run-as',pkg,'tar','-xf','-'],input=packed,check=True)
                      adb('shell','am','start','-W','-n',pkg+'/com.projectdark.mobile.MainActivity')
                  with (root/'input-timing.jsonl').open('a') as timing: timing.write(json.dumps({'index':index,'op':op,'elapsed':time.monotonic()-begun})+'\n')
          finally:
              adb('shell','pkill','-INT','screenrecord',check=False)
              try:rec.wait(timeout=15)
              except subprocess.TimeoutExpired:rec.terminate();rec.wait(timeout=5)
              adb('pull',video,str(root/'capture.mp4'),check=False)
              snap('end')
              adb('shell','input','keyevent','KEYCODE_HOME')
              pathlib.Path('last-app-pid.txt').write_text(adb('shell','pidof',pkg).stdout.decode().strip())
              (root/'activity.txt').write_bytes(adb('shell','dumpsys','activity','activities',check=False).stdout)
              (root/'pid.txt').write_bytes(adb('shell','pidof',pkg,check=False).stdout)
              saved=adb('exec-out','run-as',pkg,'tar','-cf','-','shared_prefs','files',check=False)
              (root/'test-profile-readonly.tar').write_bytes(saved.stdout)
          print(f'Stage {stage} captured; inspect end.png and video before claiming gameplay.')
          PYCODE
      - name: Capture inspected stage 1
        id: stage1
        if: ${{ !cancelled() && success() }}
        env:
          CAPTURE_STAGE: '1'
        run: python3 capture_stage.py
      - name: Upload stage 1
        if: ${{ always() && steps.stage1.outputs.finished != 'true' }}
        uses: actions/upload-artifact@v4
        with:
