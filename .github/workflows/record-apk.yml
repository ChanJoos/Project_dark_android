name: Record installed APK
on:
  push:
    branches: [dot/apk-recording-20261020]
    paths: ['.github/workflows/record-apk.yml']
permissions:
  contents: read
  actions: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_PACKAGE: 'com.projectdark.mobile.v266test'
      SOURCE_RUN: '40075882243'
      SOURCE_SHA: 'd8c3fdb8b5a5ce5141a0ad34ac036c38fd832b7a'
      SOURCE_ARTIFACT: '12553357093'
      APK_SHA256: 'd46e8cfc0655b8e9614eb0ac31579ec81a84b4e9baedf578676948af1d09a5a5'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate source run before downloading its APK
        run: |
          mkdir -p evidence input
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > evidence/source-run.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('evidence/source-run.json'))
          assert r['head_sha']==os.environ['SOURCE_SHA']
          assert r['status']=='completed' and r['conclusion']=='success'
          assert r['head_repository']['full_name']==os.environ['GH_REPO']
          PY
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/artifacts" > evidence/source-artifacts.json
          gh run download "$SOURCE_RUN" --repo "$GH_REPO" --name PROJECT_DARK_MINE_ENTRY_CANDIDATE --dir input
          python3 - <<'PY'
          import pathlib, json, hashlib, zipfile, os
          artifacts=json.load(open('evidence/source-artifacts.json'))['artifacts']
          selected=[a for a in artifacts if str(a['id'])==os.environ['SOURCE_ARTIFACT']]
          assert len(selected)==1 and not selected[0]['expired']
          assert selected[0]['name']=='PROJECT_DARK_MINE_ENTRY_CANDIDATE'
          apks=list(pathlib.Path('input').rglob('*.apk'))
          assert len(apks)==1, apks
          p=apks[0]
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['APK_SHA256']
          with zipfile.ZipFile(p) as z:
              identity=json.loads(z.read('assets/build_identity.json'))
          assert identity['sourceCommit']==os.environ['SOURCE_SHA']
          assert str(identity['runId'])==os.environ['SOURCE_RUN']
          proof={'identity':identity,'apkSha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                 'capture':'installed APK on Android emulator; not a handset recording',
                 'scope':'Mine-entry fix candidate, real class setup and input capture; inspect outcomes; development skill-test mode disclosed',
                 'audio':False}
          pathlib.Path('evidence/apk-identity.json').write_text(json.dumps(proof,indent=2))
          pathlib.Path('input/app.apk').write_bytes(p.read_bytes())
          PY
      - name: Prepare Android emulator using official SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # Never accept a new license implicitly; EOF declines any new prompt.
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' </dev/null
          test -f "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/package.xml"
          test -x "$ANDROID_HOME/emulator/emulator"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | avdmanager create avd -n apk-capture -p "$ANDROID_AVD_HOME/apk-capture.avd" -k 'system-images;android-35;google_apis;x86_64' --force
          find "$RUNNER_TEMP" -name 'apk-capture.ini' -o -name 'config.ini' > evidence/avd-paths.txt
          printf '\nhw.lcd.width=720\nhw.lcd.height=1280\nhw.lcd.density=240\nhw.cpu.ncore=2\n' >> "$ANDROID_AVD_HOME/apk-capture.avd/config.ini"
          emulator -list-avds | tee evidence/avd-list.txt
          grep -qx apk-capture evidence/avd-list.txt
          # Official Ubuntu runtime dependencies, unpacked locally without root changes.
          mkdir -p "$RUNNER_TEMP/emulator-libs/packages" "$RUNNER_TEMP/emulator-libs/root"
          (cd "$RUNNER_TEMP/emulator-libs/packages" && apt-get download libpulse0 libasyncns0 libsndfile1 libflac12t64 libogg0 libopus0 libvorbis0a libvorbisenc2 libmpg123-0t64 libmp3lame0)
          for deb in "$RUNNER_TEMP/emulator-libs/packages/"*.deb; do dpkg-deb -x "$deb" "$RUNNER_TEMP/emulator-libs/root"; done
          export LD_LIBRARY_PATH="$RUNNER_TEMP/emulator-libs/root/usr/lib/x86_64-linux-gnu:$RUNNER_TEMP/emulator-libs/root/usr/lib/x86_64-linux-gnu/pulseaudio:${LD_LIBRARY_PATH:-}"
          emulator -version > evidence/emulator-version.txt 2>&1
          # User approved only current account access in this ephemeral runner.
          getfacl /dev/kvm > evidence/kvm-acl-before.txt
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          getfacl /dev/kvm > evidence/kvm-acl-after.txt
          emulator -accel-check > evidence/acceleration.txt 2>&1
          emulator -avd apk-capture -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -accel on -memory 4096 > evidence/emulator.log 2>&1 &
          EMULATOR_PID=$!
          sleep 5
          kill -0 "$EMULATOR_PID" || { cat evidence/emulator.log; exit 1; }
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do sleep 2; done'
          adb shell input keyevent 82
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          adb shell wm size 720x1280
          adb shell wm density 240
      - name: Install exact artifact and record real running app
        run: |
          adb install -r input/app.apk | tee evidence/install.txt
          adb shell pm list packages | grep projectdark | tee evidence/packages.txt
          PKG=com.projectdark.mobile.v266test
          adb shell pm path "$PKG" | tee evidence/installed-path.txt
          adb shell am start -W -n "$PKG/com.projectdark.mobile.MainActivity" | tee evidence/launch.txt
          sleep 8
          # Dismiss the observed Android first-run fullscreen tutorial, not a permission dialog.
          adb shell input tap 893 253
          sleep 20
          # Only explicit dedicated filming profiles, never a user's save.
          mkdir -p profiles
          gh run download "$SOURCE_RUN" --repo "$GH_REPO" --name DEDICATED_FILMING_PROFILES --dir profiles
          test -f profiles/ROGUE/provenance.json
          cp profiles/ROGUE/provenance.json evidence/rogue-profile-provenance.json
          cp profiles/MAGE/provenance.json evidence/mage-profile-provenance.json
          python3 - <<'PYVERIFY'
          import json
          a=json.load(open('evidence/source-artifacts.json'))['artifacts']
          assert any(str(x['id'])=='12552962428' and x['name']=='DEDICATED_FILMING_PROFILES' for x in a)
          for job in ('ROGUE','MAGE'):
              p=json.load(open('profiles/'+job+'/provenance.json'))
              assert p['job']==job and p['level']==99 and p['firstAdvanced'] is True
              assert all(p[k]==1000000 for k in ('currentHp','maxHp','currentMp','maxMp'))
              assert p['auto'] is False
          PYVERIFY
          # Resume only untouched checkpoints from this authorized filming session.
          mkdir -p checkpoints/MAGE checkpoints/ROGUE
          gh api repos/$GH_REPO/actions/artifacts/12554636059/zip > mage-checkpoint.zip
          gh api repos/$GH_REPO/actions/artifacts/12554095563/zip > rogue-checkpoint.zip
          unzip -q mage-checkpoint.zip -d checkpoints/MAGE
          unzip -q rogue-checkpoint.zip -d checkpoints/ROGUE
          adb shell am force-stop "$PKG"
          adb exec-in run-as "$PKG" tar -xf - < checkpoints/MAGE/test-profile-readonly.tar
          adb shell am start -W -n "$PKG/com.projectdark.mobile.MainActivity"
          sleep 5
          adb shell pidof "$PKG" | tee evidence/pid-before.txt
          adb shell dumpsys activity activities > evidence/activity.txt
          adb exec-out screencap -p > evidence/start.png
          mkdir -p evidence/boot
          cp evidence/start.png evidence/boot/start.png
          cp evidence/apk-identity.json evidence/boot/apk-identity.json
      - name: Upload boot checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-${{ github.run_id }}-boot
          path: evidence/boot/
          retention-days: 7
      - name: Measure two bounded raw capture pilots
        run: |
          cat > pilot.py <<'PYCODE'
          import subprocess,time,pathlib,json
          root=pathlib.Path('evidence/pilot');root.mkdir(parents=True,exist_ok=True)
          pkg='com.projectdark.mobile.v266test'
          def adb(*a,check=True):return subprocess.run(['adb',*a],check=check,capture_output=True)
          for width,height,density in [(1280,720,240),(960,540,160)]:
              tag=f'{width}x{height}'; dest=root/tag;dest.mkdir()
              adb('shell','am','force-stop',pkg)
              subprocess.run(['adb','exec-in','run-as',pkg,'tar','-xf','-'],input=pathlib.Path('checkpoints/MAGE/test-profile-readonly.tar').read_bytes(),check=True)
              adb('shell','wm','size',f'{height}x{width}');adb('shell','wm','density',str(density))
              adb('shell','am','start','-W','-n',pkg+'/com.projectdark.mobile.MainActivity');time.sleep(5)
              # Dismiss only the observed non-permission immersive-mode tutorial.
              gotit=(927,285) if width==1280 else (670,190)
              adb('shell','input','tap',str(gotit[0]),str(gotit[1]));time.sleep(2)
              # Warm actual movement/render caches before measuring, without combat or screenshots.
              ws=width/960
              warm=[]
              for _ in range(2):
                  for ex in (60,160):warm.append(f'input swipe {round(110*ws)} {round(374*ws)} {round(ex*ws)} {round(374*ws)} 700')
              adb('shell','; '.join(warm));time.sleep(3)
              (dest/'start.png').write_bytes(adb('exec-out','screencap','-p').stdout)
              adb('shell','dumpsys','gfxinfo',pkg,'reset')
              video='/sdcard/pilot-'+tag+'.mp4'
              rec=subprocess.Popen(['adb','shell','screenrecord','--size',tag,'--bit-rate','4000000','--time-limit','60',video],stdout=(dest/'record.log').open('wb'),stderr=subprocess.STDOUT)
              time.sleep(.5)
              s=width/960
              def tap(x,y):return f'input tap {round(x*s)} {round(y*s)}'
              def swipe(x2,y2):return f'input swipe {round(110*s)} {round(374*s)} {round(x2*s)} {round(y2*s)} 700'
              # Real normal inputs. No screenshots, blanket pauses or frame interpolation within take.
              commands=[]
              for _ in range(4):commands.extend([swipe(60,374),swipe(160,374)])
              commands.extend([tap(657,456),'sleep 1.05',tap(735,456),'sleep 4'])
              started=time.monotonic();adb('shell','; '.join(commands));elapsed=time.monotonic()-started
              adb('shell','pkill','-INT','screenrecord',check=False);rec.wait(timeout=15)
              adb('pull',video,str(dest/'capture.mp4'))
              (dest/'end.png').write_bytes(adb('exec-out','screencap','-p').stdout)
              (dest/'gfxinfo.txt').write_bytes(adb('shell','dumpsys','gfxinfo',pkg,'framestats').stdout)
              (dest/'surfaceflinger.txt').write_bytes(adb('shell','dumpsys','SurfaceFlinger').stdout)
              (dest/'top.txt').write_bytes(adb('shell','top','-b','-n','1').stdout)
              (dest/'timing.json').write_text(json.dumps({'inputElapsedSeconds':elapsed,'commands':commands,'width':width,'height':height,'density':density,'renderer':'SwiftShader','bitrate':4000000},indent=2))
          PYCODE
          python3 pilot.py
          ps -eo pid,pcpu,pmem,args --sort=-pcpu | head -20 > evidence/host-cpu.txt
      - name: Preserve pilot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-pilot-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Stop temporary emulator
        if: always()
        run: adb emu kill || true

