name: Prepare exact V162 delivery bundle
on:
  push:
    branches: [codex/rucesion-coast-v157]
    paths:
      - tools/prepare_v162_delivery.py
      - .github/workflows/v162-delivery.yml
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Prove runtime bytes unchanged from the tested source
        run: git diff --exit-code 6f3ac7b900299330b7e15c1d374f3d56048c86db -- app/src/main/java app/build.gradle master/source/abel_v161
      - uses: actions/download-artifact@v4
        with:
          name: coast-v162-apk-6f3ac7b900299330b7e15c1d374f3d56048c86db
          run-id: 38664473610
          github-token: ${{ github.token }}
          path: input-apk
      - uses: actions/download-artifact@v4
        with:
          name: coast-v162-native-6f3ac7b900299330b7e15c1d374f3d56048c86db
          run-id: 38664473610
          github-token: ${{ github.token }}
          path: input-native
      - name: Reproduce pack, verify128 and compose actual native comparisons
        run: |
          pip install numpy==2.3.5 Pillow==12.3.0 scipy==1.17.0
          python3 tools/build_abel_v161.py
          python3 tools/prepare_v162_delivery.py
      - uses: actions/upload-artifact@v4
        with:
          name: PROJECT_DARK_V162_COMPLETE_DELIVERY
          path: v162-delivery/
          retention-days: 90
          if-no-files-found: error
