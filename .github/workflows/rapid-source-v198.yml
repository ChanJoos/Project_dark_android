name: Rapid V198 original source recovery
on:
  push:
    paths:
      - tools/recover_rapid_v198.py
      - .github/workflows/rapid-source-v198.yml
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/recover_rapid_v198.py
      - uses: actions/upload-artifact@v4
        with:
          name: rapid-v198-original-sources
          path: rapid-v198/
          if-no-files-found: error
