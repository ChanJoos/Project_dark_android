name: Software Canvas capture pilot
on:
  push:
    branches: [dot/capture-software-canvas]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software-canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JAVA_TOOL_OPTIONS: '-Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2'
      PROJECT_DARK_SOURCE_SHA: ${{ github.sha }}
      PROJECT_DARK_SIDE_BY_SIDE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Offline source generator dependencies
        run: pip install numpy==2.3.5 Pillow==12.3.0 scipy==1.17.0
      - name: Scoped mine arrival, navigation, population, save and renderer regression
        run: >-
          gradle :app:testCaptureSoftwareUnitTest
          --tests '*MineEntryArrivalTest'
          --tests '*MineHuntV208Test'
          --tests '*MineHuntV209Test'
          --tests '*RogueAmnesiaV236Test'
          --tests '*RogueCombatV234Test.shuriken*'
          --tests '*RequestedWeaponLoadoutTest'
          --tests '*RequestedOutfitPreviewTest'
          --tests '*FilmingProfileExportTest'
          --stacktrace
      - name: Build exact candidate
        run: |
          gradle :app:assembleCaptureSoftware :app:processDebugMainManifest --stacktrace
          python3 tools/verify_capture_canvas_manifest.py
          mkdir -p delivery
          cp app/build/outputs/apk/captureSoftware/app-captureSoftware.apk delivery/PROJECT_DARK_SOFTWARE_CANVAS_PILOT.apk
          sha256sum delivery/*.apk > delivery/SHA256SUMS
          python3 - <<'PY'
          import os,json,datetime,zipfile
          from pathlib import Path
          apk=Path('delivery/PROJECT_DARK_SOFTWARE_CANVAS_PILOT.apk')
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              identity=json.loads(z.read('assets/build_identity.json'))
              assert identity['sourceCommit']==os.environ['GITHUB_SHA']
              assert identity['runId']==os.environ['GITHUB_RUN_ID']
          Path('delivery/build.json').write_text(json.dumps(dict(identity=identity,builtUTC=datetime.datetime.now(datetime.timezone.utc).isoformat(),scope='Software Canvas capture experiment; not main; device performance pending',renderer='software Canvas',package='com.projectdark.mobile.v266test.canvas'),indent=2))
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose delivery/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOFTWARE_CANVAS_DIAGNOSTICS
          retention-days: 7
          path: |
            app/build/intermediates/merged_manifest/
            app/build/intermediates/merged_manifests/
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/device-review/
            build/reports/device-review/
            build/reports/horror-v179/
            app/build/reports/horror-v179/
      - uses: actions/upload-artifact@v4
        with:
          name: PROJECT_DARK_SOFTWARE_CANVAS_PILOT
          retention-days: 7
          path: delivery/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DEDICATED_FILMING_PROFILES
          retention-days: 7
          path: app/build/reports/horror-v179/filming-profiles/
          if-no-files-found: error
