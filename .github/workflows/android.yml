name: Validate PROJECT DARK Android
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Fetch one official equipment image into repository
        if: ${{ github.ref == 'refs/heads/data/equipment-asset-evidence-pipeline-20260918' }}
        shell: bash
        run: |
          TARGET="assets/items/equipment/reference/ASSET_NX5054_HOLDIT_UPGRADE.png"
          if [ ! -f "$TARGET" ]; then
            mkdir -p "$(dirname "$TARGET")"
            curl --fail --location --retry 3 --user-agent "Mozilla/5.0" \
              "https://storage.nexon.com/dsk00/00/NX_FILE/Board/65536/05/1/000/00/00/4620787655423033475.png" \
              -o "$TARGET"
            file "$TARGET"
            test "$(wc -c < "$TARGET")" -gt 10000
            git config user.name "project-dark-asset-bot"
            git config user.email "project-dark-asset-bot@users.noreply.github.com"
            git add "$TARGET"
            git commit -m "Assets: store official Holdit Ring equipment reference image"
            git push origin HEAD:data/equipment-asset-evidence-pipeline-20260918
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate Master DB
        run: python tools/validate_master.py
      - name: Compile debug sources
        run: gradle :app:compileDebugJavaWithJavac --stacktrace
      - name: Execute F5M production Quick Quest route audit
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.world.F5mProductionQuickQuestRouteTest --stacktrace
      - name: Execute Quick Quest optimal approach audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.world.QuickQuestApproachPathAudit
      - name: Execute 4-way BODY robe mokdo visual contract audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.PlayerFourWayVisualContractAudit
      - name: Recover named equipment identities from existing assets
        run: python master/tools/build_asset_recovered_catalog.py
      - name: Build merged Item Master
        run: python master/tools/build_merged_item_master.py
      - name: Recover expanded equipment master from existing assets
        run: python master/tools/build_equipment_master_from_assets.py
      - name: Canonical equipment merge audit
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          r=Path("master/canonical")
          merged=list(csv.DictReader(open(r/"generated/Item_Master_Merged.csv",encoding="utf-8-sig")))
          recovered=list(csv.DictReader(open(r/"Equipment_Asset_Recovered_Catalog.csv",encoding="utf-8-sig")))
          inv=list(csv.DictReader(open(r/"Existing_Equipment_Asset_Inventory.csv",encoding="utf-8-sig")))
          ids=[x["Item_ID"] for x in merged]
          if len(ids)!=len(set(ids)): raise SystemExit("duplicate Item_ID in canonical merged master")
          equip=[x for x in merged if x.get("대분류")=="장비"]
          if not recovered: raise SystemExit("asset recovered catalog is empty")
          if len(inv)!=3692: raise SystemExit(f"asset inventory drift: {len(inv)} != 3692")
          print(f"CANONICAL_EQUIPMENT_MERGE=PASS canonical_items={len(merged)} canonical_equipment={len(equip)} recovered_from_assets={len(recovered)} asset_inventory={len(inv)}")
          PY
      - name: Commit generated equipment catalog evidence
        if: ${{ github.ref == 'refs/heads/data/equipment-asset-evidence-pipeline-20260918' }}
        run: |
          git add master/canonical/Equipment_Asset_Recovered_Catalog.csv master/canonical/generated/Item_Master_Merged.csv master/canonical/Equipment_Master_Expanded.csv master/canonical/Equipment_Stats_Missing.csv master/canonical/Item_Existing_Asset_Map.csv || true
          if ! git diff --cached --quiet; then
            git config user.name "project-dark-data-bot"
            git config user.email "project-dark-data-bot@users.noreply.github.com"
            git commit -m "Data: materialize expanded equipment master and asset mapping"
            git push origin HEAD:data/equipment-asset-evidence-pipeline-20260918
          fi
      - name: Map existing equipment image library
        run: python master/tools/map_existing_equipment_assets.py
      - name: Equipment asset evidence audit
        run: python master/tools/audit_equipment_assets.py
      - name: Milddok ingestion identity audit
        run: python master/tools/audit_milddok_ingestion.py
      - name: Execute Combat v3 FinalStats pipeline audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.CombatV3PipelineAudit
      - name: Execute Growth Core v3 and FinalStats audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.GrowthCoreV3Audit
      - name: Execute Growth v2 coherence audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.GrowthV2CoherenceAudit
      - name: Execute Growth v2 Quest2 and stat progression audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.GrowthV2LoopAudit
      - name: Execute F5M gameplay contract audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.F5mAdaptedPrologueQuestAudit
      - name: Execute F5M production runtime binding audit
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.F5mRuntimeBindingTest --stacktrace
      - name: Execute F5M restart persistence matrix
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.F5mRestartPersistenceMatrixTest --stacktrace
      - name: Execute runtime checkpoint and legacy migration regression
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.RuntimeCheckpointTest --stacktrace
      - name: Execute device recording regressions with native source rendering
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.DeviceRecordingRegressionTest --tests com.projectdark.mobile.ShirtRenderingRegressionTest --stacktrace
      - name: Upload device review rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-review-${{ github.sha }}
          path: app/build/reports/device-review/
          if-no-files-found: ignore
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT_DARK-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
