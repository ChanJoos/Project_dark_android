name: Validate PROJECT DARK Android
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Recover starter gear source manifests
        run: |
          python3 tools/collect_peasant_sources.py
          python3 - <<'PY'
          import json, pathlib, sys
          rows=json.loads(pathlib.Path('qa/peasant-sources/retrieval.json').read_text())
          need={'ml228','ml229','ml230','ms001','ms002','ms003','mh172','mh173','mh174','mw001','mw002','mw003','mw004','mw005','mw006','mw007','mw008','mw009','mw010','mu0000001','mu0000002','mu0000003'}
          got={r['identity'] for r in rows if r.get('status')=='FETCHED' and '/data/type/' in r['url']}
          missing=need-got
          print('SOURCE_REGISTRATION_FETCHED',sorted(got & need))
          print('SOURCE_REGISTRATION_MISSING',sorted(missing))
          if missing:
              sys.exit(23)
          PY
          mkdir -p app/src/main/assets/source-registration
          cp qa/peasant-sources/data/type/body/mm001.json app/src/main/assets/source-registration/mm001.json
          cp qa/peasant-sources/data/type/shoes/ml228.json app/src/main/assets/source-registration/ml228.json
          cp qa/peasant-sources/data/type/shield/ms001.json app/src/main/assets/source-registration/ms001.json
          cp qa/peasant-sources/data/type/hair/mh172.json app/src/main/assets/source-registration/mh172.json
          cp qa/peasant-sources/atlas/shoes/ml228.webp app/src/main/res/drawable-nodpi/player_shoes_ml228_source.webp
          cp qa/peasant-sources/atlas/shield/ms001.webp app/src/main/res/drawable-nodpi/player_shield_ms001_source.webp
          cp qa/peasant-sources/atlas/hair/mh172.webp app/src/main/res/drawable-nodpi/player_hat_mh172_source.webp
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          specs={'shoes':['ml228','ml229','ml230'],'shield':['ms001','ms002','ms003'],'hair':['mh172','mh173','mh174'],'weapon':['mw001','mw002','mw003','mw004','mw005','mw006','mw007','mw008','mw009','mw010'],'armor':['mu0000001','mu0000002','mu0000003']}
          assets=Path('app/src/main/assets/source-registration'); draw=Path('app/src/main/res/drawable-nodpi')
          for kind, ids in specs.items():
              for ident in ids:
                  shutil.copy(Path('qa/peasant-sources/data/type')/kind/(ident+'.json'), assets/(ident+'.json'))
                  shutil.copy(Path('qa/peasant-sources/atlas')/kind/(ident+'.webp'), draw/('equip_'+ident+'_source.webp'))
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          for ident in ('mm001','mu0000001','ml228','ms001','mh172'):
              p=Path('qa/peasant-sources/data/type')
              found=list(p.glob('*/'+ident+'.json'))
              if not found: continue
              d=json.loads(found[0].read_text())
              print('META',ident,{k:v for k,v in d.items() if k!='sprites'})
          for ident in ('mm001','mu0000001'):
              found=list(Path('qa/peasant-sources/data/type').glob('*/'+ident+'.json'))
              d=json.loads(found[0].read_text())
              for g in ('01','02','03','b','c','d','e','f'):
                  if g in d['sprites']: print('BASE_REG',ident,g,d['sprites'][g][:12])
          PY
          python3 - <<'PY'
          import json, pathlib
          for ident in ('ml228','ms001','mh172'):
              p=pathlib.Path('app/src/main/assets/source-registration')/(ident+'.json')
              d=json.loads(p.read_text())
              sprites=d['sprites']
              print('REG_MANIFEST',ident,'count',len(sprites))
              for k in list(sprites)[:12]:
                  print('REG',ident,k,sprites[k])
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate Master DB
        run: python tools/validate_master.py
      - name: Verify generated skill catalog matches Master
        run: |
          python tools/generate_skill_catalog.py
          git diff --exit-code -- app/src/main/assets/skills/catalog.json
      - name: Verify project skill learning policy is reproducible
        run: |
          python tools/generate_mobile_skill_policy.py
          git diff --exit-code -- app/src/main/assets/skills/mobile_learning.json
      - name: Verify skill presentation mapping is reproducible
        run: |
          python tools/generate_skill_presentation.py
          git diff --exit-code -- app/src/main/assets/skill-presentation docs/SKILL_PRESENTATION_MAPPING.csv app/src/main/java/com/projectdark/mobile/SkillActionData.java
      - name: Audit reusable Milles map assets and layout
        run: python tools/assets/audit_milles_map_assets.py
      - name: Verify V101 source metal feet and scenery-only style
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.world.MillesSourceStyleTest --stacktrace
      - name: Verify generated V108 mouse directions and animation frames are reproducible
        run: |
          pip install Pillow
          python tools/assets/build_v108_mouse_animation.py
          git diff --exit-code -- assets/milles/production/interiors/v108
      - name: Verify V86 town interiors, dual-tile doors, numeric merchant input, source-backed gear stats, atomic trade and bank restart
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.TownInteriorTest --stacktrace
      - name: Verify V90 adapted Milles story quest and shared mouse AI
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.InnDetailQuestFxTest --tests com.projectdark.mobile.InnWorldObjectTest --tests com.projectdark.mobile.InnSourceRepairTest --tests com.projectdark.mobile.MillesStoryQuestTest --tests com.projectdark.mobile.MillesMousePresentationTest --tests com.projectdark.mobile.FieldTransitionE2ETest --stacktrace
      - name: Verify V108 quest actions and full campaign route audit
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.CampaignQuickQuestIntegrationTest --tests com.projectdark.mobile.CampaignProgressTest --tests com.projectdark.mobile.QuestJournalTest --tests com.projectdark.mobile.QuickQuestLatencyTest --tests com.projectdark.mobile.HudTouchAcceptanceTest --stacktrace
      - name: Verify V97 quest list, state filters, compact navigation and restart
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.QuestJournalTest --stacktrace
      - name: Verify V99 equipment UI fonts, all modal input and wide native rendering
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.ModernUiTest --stacktrace
      - name: Verify V96 four-way carry, all weapon motions and complete defense jump
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.ChungryongWeaponTest --stacktrace
      - name: Verify LV40 monster rewards, job choice, wardrobe and restart
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.AdaptedCampaignRewardTest --tests com.projectdark.mobile.NpcAppearanceTest --tests com.projectdark.mobile.F5mRestartPersistenceMatrixTest --stacktrace
      - name: Verify V95 low-resource Dara recipient release and cancellation
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.DaraRecipientFxTest --stacktrace
      - name: Verify V83 per-skill abilities and runtime formulas
        run: |
          python3 tools/generate_skill_abilities.py
          git diff --exit-code -- app/src/main/assets/skills/abilities.json app/src/main/java/com/projectdark/mobile/SkillAbilityData.java docs/SKILL_ABILITY_FORMULAS.csv
          gradle :app:testDebugUnitTest --tests com.projectdark.mobile.SkillAbilityRuntimeTest --stacktrace
      - name: Verify classic capture sources and projections
        run: |
          pip install numpy Pillow scipy
          python tools/import_classic_skill_references.py
          python tools/import_rogue_skill_references.py
          python tools/import_all_job_skill_references.py
          python tools/audit_skill_source_coverage.py
          git diff --exit-code -- app/src/main/assets/skill-presentation/warrior app/src/main/assets/skill-presentation/shared docs/SKILL_SOURCE_COVERAGE.csv
          git diff --exit-code -- app/src/main/assets/skill-presentation/rogue
          git diff --exit-code -- app/src/main/assets/skill-presentation/classic
      - name: Verify source window crops are reproducible
        run: |
          python tools/extract_skill_window_reference.py
          git diff --exit-code -- app/src/main/assets/skill-window
      - name: Audit every skill FX source and runtime precedence
        run: |
          python3 tools/audit_runtime_skill_fx.py
          git diff --exit-code -- docs/SKILL_FX_RUNTIME_AUDIT.csv docs/verification/SKILL_FX_V81_AUDIT.json
          python3 tools/audit_provided_skill_sources.py
          git diff --exit-code -- docs/REMAINING_ORIGINAL_SKILL_FX.csv docs/verification/PROVIDED_SOURCE_RECHECK_V81.json
      - name: Verify item window source crops and input
        run: |
          python3 tools/extract_item_window_reference.py
          git diff --exit-code -- app/src/main/assets/item-window
          gradle :app:testDebugUnitTest --tests com.projectdark.mobile.ItemWindowReferenceTest --tests com.projectdark.mobile.EquipmentStatsAndDetailsTest --stacktrace
      - name: Verify skill window, shared combat and restart persistence
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.MartialHudAutoRegressionTest --tests com.projectdark.mobile.SkillFxAuditTest --tests com.projectdark.mobile.SkillWindowReferenceTest --tests com.projectdark.mobile.SkillWindowTest --tests com.projectdark.mobile.SkillPresentationTest --tests com.projectdark.mobile.SkillTestModeTest --tests com.projectdark.mobile.SkillSpatialContractTest --tests com.projectdark.mobile.SkillQuickslotApproachTest --tests com.projectdark.mobile.CapturedSkillFxTest --tests com.projectdark.mobile.ClassicSkillReferenceTest --tests com.projectdark.mobile.RogueSkillReferenceTest --tests com.projectdark.mobile.AllJobSkillSourceTest --tests com.projectdark.mobile.SkillContactRegressionTest --tests com.projectdark.mobile.MartialDefenseStarRegressionTest --tests com.projectdark.mobile.RagnarokSourceCaptureTest --stacktrace
      - name: Compile debug sources
        run: gradle :app:compileDebugJavaWithJavac --stacktrace
      - name: Execute F5M production Quick Quest route audit
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.world.F5mProductionQuickQuestRouteTest --stacktrace
      - name: Execute Bundle B Milles early-loop audit
        run: |
          javac -cp app/src/main/java app/src/main/java/com/projectdark/mobile/world/MillesEarlyLoopContract.java app/src/main/java/com/projectdark/mobile/world/MillesEarlyLoopAudit.java
          java -cp app/src/main/java com.projectdark.mobile.world.MillesEarlyLoopAudit

      - name: Execute Bundle B1 building scale audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.world.MillesB1ScaleAudit
      - name: Execute Bundle B5 integrated loop audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.BundleB5Audit
      - name: Execute Quick Quest optimal approach audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.world.QuickQuestApproachPathAudit
      - name: Verify HUD leaves empty-world tap regions available
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.HudTouchAcceptanceTest --stacktrace
      - name: Verify V100 Milles whole-map depth, scenery collision and district navigation
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.MillesReconstructionTest --stacktrace
      - name: Render West, South and Waterside Milles districts
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.MillesDistrictReviewTest --stacktrace
      - name: Render POTE production forest review frames
        run: |
          gradle :app:testDebugUnitTest --tests com.projectdark.mobile.PoteVisualReviewTest --stacktrace
          gradle :app:testDebugUnitTest --tests com.projectdark.mobile.PoteForestSpatialGrammarTest --tests com.projectdark.mobile.PoteMonsterPlayableRuntimeTest --tests com.projectdark.mobile.MonsterDamagePresentationTest --tests com.projectdark.mobile.PotePamfetPresentationTest --tests com.projectdark.mobile.PoteCreekWaterAssetTest --tests com.projectdark.mobile.AutoAttackTargetSelectorTest --tests com.projectdark.mobile.MonsterChasePathfinderTest --tests com.projectdark.mobile.world.WorldMoveTargetControllerPathTest --stacktrace
      - name: Execute 4-way BODY robe mokdo visual contract audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.PlayerFourWayVisualContractAudit
      - name: Milddok ingestion identity audit
        run: python master/tools/audit_milddok_ingestion.py
      - name: Execute Combat v3 FinalStats pipeline audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.CombatV3PipelineAudit
      - name: Execute Growth Core v3 and FinalStats audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.GrowthCoreV3Audit
      - name: Execute Growth v2 coherence audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.GrowthV2CoherenceAudit
      - name: Execute Growth v2 Quest2 and stat progression audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.GrowthV2LoopAudit
      - name: Execute F5M gameplay contract audit
        run: java -cp "app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:$ANDROID_HOME/platforms/android-35/android.jar" com.projectdark.mobile.F5mAdaptedPrologueQuestAudit
      - name: Execute F5M production runtime binding audit
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.F5mRuntimeBindingTest --stacktrace
      - name: Execute F5M restart persistence matrix
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.F5mRestartPersistenceMatrixTest --stacktrace
      - name: Execute runtime checkpoint and legacy migration regression
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.RuntimeCheckpointTest --stacktrace
      - name: Execute device recording regressions with native source rendering
        run: gradle :app:testDebugUnitTest --tests com.projectdark.mobile.DeviceRecordingRegressionTest --tests com.projectdark.mobile.ShirtRenderingRegressionTest --stacktrace
      - name: Print unit test failure details
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          found=0
          for file in files:
              root=ET.parse(file).getroot()
              for case in root.iter('testcase'):
                  failure=case.find('failure')
                  if failure is None: failure=case.find('error')
                  if failure is not None:
                      found+=1
                      print(f'FAILED {case.get("classname")}.{case.get("name")}')
                      print(failure.get('message',''))
                      print((failure.text or '')[-5000:])
          if not found: print('No JUnit failure detail XML found.')
          PY
      - name: Upload device review rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-review-${{ github.sha }}
          path: |
            app/build/reports/device-review/v89-*.png
            app/build/reports/device-review/v90-*.png
            app/build/reports/device-review/v91-*.png
            app/build/reports/device-review/v92-*.png
            app/build/reports/device-review/v93-*.png
            app/build/reports/device-review/v88-*.png
          if-no-files-found: error
      - name: Upload focused V93 review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inn-v93-review-${{ github.sha }}
          path: app/build/reports/device-review/v93-*.png
          if-no-files-found: warn
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload focused V96 weapon and jump review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weapon-v96-review-${{ github.sha }}
          path: app/build/reports/device-review/v96-*.png
          if-no-files-found: warn
      - name: Upload focused V95 Dara review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dara-v95-review-${{ github.sha }}
          path: app/build/reports/device-review/v95-*.png
          if-no-files-found: warn
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT_DARK-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload focused V97 quest review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quest-v97-review-${{ github.sha }}
          path: app/build/reports/device-review/v97-*.png
          if-no-files-found: warn
      - name: Upload focused V99 UI review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-v99-review-${{ github.sha }}
          path: app/build/reports/device-review/v99-*.png
          if-no-files-found: warn
      - name: Upload focused V100 Milles review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milles-v100-review-${{ github.sha }}
          path: |
            app/build/reports/device-review/v100-*.png
            app/build/reports/device-review/v101-*.png
          if-no-files-found: error
      - name: Publish directly downloadable candidate APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/town-interiors-mobile-v86'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q 'versionCode 104' app/build.gradle || exit 0
          mkdir -p apk-delivery
          cp app/build/outputs/apk/debug/app-debug.apk apk-delivery/PROJECT_DARK_V104.apk
          sha256sum apk-delivery/PROJECT_DARK_V104.apk > apk-delivery/SHA256SUMS.txt
          tag="candidate-v104-${GITHUB_SHA:0:8}"
          python3 - <<'PYINFO'
          import json,os,pathlib,hashlib,datetime
          p=pathlib.Path('apk-delivery/PROJECT_DARK_V104.apk')
          report={'sourceCommit':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'candidate':True,'versionCode':104,'apkSha256':hashlib.sha256(p.read_bytes()).hexdigest(),'apkBytes':p.stat().st_size,'builtSeoul':datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(),'verification':'Full configured CI and native runtime gates passed. Physical phone and user visual acceptance pending.'}
          pathlib.Path('apk-delivery/BUILD_INFO.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PYINFO
          gh release create "$tag" apk-delivery/PROJECT_DARK_V104.apk apk-delivery/SHA256SUMS.txt apk-delivery/BUILD_INFO.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'PROJECT DARK V104 NPC 공통 캐릭터·새 복장 후보' --notes "구 밀레스 분수공원·정원·물가 배치, 전체 장식 정리·발 기준 가림·충돌 일치. Source: $GITHUB_SHA. Native CI verified; phone/user review pending."
      - name: Publish exact V108 device-fix candidate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/town-interiors-mobile-v86'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          grep -q 'versionCode 108' app/build.gradle
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$SOURCE_SHA^{tree}")"
          mkdir -p apk-delivery
          cp app/build/outputs/apk/debug/app-debug.apk apk-delivery/PROJECT_DARK_V108.apk
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib
          p=pathlib.Path('apk-delivery/PROJECT_DARK_V108.apk')
          info={'sourceCommit':os.environ['SOURCE_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'candidate':True,'versionCode':108,'versionName':'1.08-quest-runtime-fixes','apkSha256':hashlib.sha256(p.read_bytes()).hexdigest(),'apkBytes':p.stat().st_size,'builtSeoul':datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat(),'scope':'M07 GameView quickquest from Milles through travel guide, forest entry, objective target, approach and first counted autoattack; three visible Shortblade quickslot uses counted from accepted ACTION_STARTED events (healing still requires positive applied HP restoration); four-direction mouse idle/walk A/walk B/attack animations connected to live inn/field AI states with normalized frame bounds and anchor. Five 23-quest campaign routes retain their resolver/progression simulation audit. Exact PR-head/tree equality checked before APK publication.','phoneAcceptance':'PENDING','userVisualAcceptance':'PENDING'}
          pathlib.Path('apk-delivery/BUILD_INFO.json').write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n')
          PY
          tag="candidate-v108-${SOURCE_SHA:0:8}"
          gh release create "$tag" apk-delivery/PROJECT_DARK_V108.apk apk-delivery/BUILD_INFO.json --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --title 'PROJECT DARK V108 퀘스트·쥐 동작 검증 후보' --notes "정확한 PR head $SOURCE_SHA에서 생성. M07 퀵퀘스트 전체 경로/첫 처치, 숏블레이드 3회 실제 슬롯 사용 카운트, 네 방향 쥐 idle/walk/attack 애니메이션 native regression 포함. 전체 Android CI 통과 후 생성. 실제 휴대폰 동작·시각 확인은 별도 대기 중."
