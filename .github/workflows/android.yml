name: Validate PROJECT DARK Android
on:
  push:
    branches: [main, 'agent/**', 'director/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate all Master tables and pointer ownership rules
        run: |
          python3 tools/validate_master.py --write-report
          mkdir -p build/rule-tests
          javac -d build/rule-tests app/src/main/java/com/projectdark/mobile/ui/TouchOwnership.java tests/TouchOwnershipTest.java
          java -cp build/rule-tests TouchOwnershipTest
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile and assemble app and instrumentation APKs
        run: gradle :app:compileDebugJavaWithJavac :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Record APK identity
        run: |
          mkdir -p build/evidence
          sha256sum app/build/outputs/apk/debug/app-debug.apk > build/evidence/APK_SHA256.txt
          echo "${{ github.sha }}" > build/evidence/COMMIT_SHA.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: project-dark-debug-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            build/evidence/*
            master/VALIDATION_REPORT.json
      - name: Enable emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run real Android View and game state checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tools/runtime_smoke.sh
      - name: Upload runtime logs and compositor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-dark-runtime-${{ github.sha }}
          if-no-files-found: warn
          path: runtime-evidence/
