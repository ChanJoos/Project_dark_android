plugins { id 'com.android.application' }

android {
    namespace 'com.projectdark.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.projectdark.mobile'
        minSdk 26
        targetSdk 35
        versionCode 46
        versionName '0.46-milles-vertical-slice'
    }
    sourceSets {
        main {
            assets.srcDirs += ['../assets/milles/production']
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
