plugins { id 'com.android.application' }

android {
    namespace 'com.projectdark.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.projectdark.mobile'
        if (System.getenv('PROJECT_DARK_SIDE_BY_SIDE') == '1') applicationIdSuffix '.v218test'
        manifestPlaceholders = [appLabel: System.getenv('PROJECT_DARK_SIDE_BY_SIDE') == '1' ? 'PROJECT DARK V218 TEST' : 'PROJECT DARK']
        minSdk 26
        targetSdk 35
        versionCode 184
        versionName '1.84-mobile-horror'
        buildConfigField 'String', 'SOURCE_SHA', '"' + (System.getenv('PROJECT_DARK_SOURCE_SHA') ?: 'LOCAL_UNVERIFIED') + '"'
    }
    buildFeatures { buildConfig true }
    sourceSets {
        main {
            assets.srcDirs += ['../assets/milles/production', '../assets/pote/production', layout.buildDirectory.dir('generated/build-identity').get().asFile, layout.buildDirectory.dir('generated/wardrobe-v128').get().asFile, layout.buildDirectory.dir('generated/abel-v139').get().asFile, layout.buildDirectory.dir('generated/horror-v180-pack').get().asFile, layout.buildDirectory.dir('generated/mine-hunt-v208').get().asFile, layout.buildDirectory.dir('generated/temple-v211').get().asFile, layout.buildDirectory.dir('generated/wearables-v212').get().asFile, layout.buildDirectory.dir('generated/death-v217').get().asFile]
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        // Native source rendering retains large atlases; isolate each test class.
        unitTests.all {
            maxHeapSize = '1546m'
            maxParallelForks = 1
            forkEvery = 1
            testLogging { exceptionFormat = 'full' }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// The identity is embedded in the APK that was tested, not inferred from a release name.
def identitySource = System.getenv('PROJECT_DARK_SOURCE_SHA') ?: 'LOCAL_UNVERIFIED'
def identityRun = System.getenv('GITHUB_RUN_ID') ?: 'LOCAL'
tasks.register('writeBuildIdentity') {
    inputs.property('sourceCommit', identitySource)
    inputs.property('runId', identityRun)
    outputs.file(layout.buildDirectory.file('generated/build-identity/build_identity.json'))
    doLast {
        def out = layout.buildDirectory.file('generated/build-identity/build_identity.json').get().asFile
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.toJson([sourceCommit: identitySource, runId: identityRun, versionCode: 184, versionName: '1.84-mobile-horror']) + '\n'
    }
}
tasks.named('preBuild').configure { dependsOn('writeBuildIdentity') }

// Retained exact asset bundle keeps fresh builds reproducible without network recovery.
tasks.register('extractWardrobeV128', Copy) {
    from(zipTree(rootProject.file('master/source/equipment/identity_v128/generated_assets.zip')))
    into(layout.buildDirectory.dir('generated/wardrobe-v128'))
    includeEmptyDirs = false
    eachFile { f -> if (file('src/main/assets/' + f.path).exists()) f.exclude() }
}
tasks.named('preBuild').configure { dependsOn('extractWardrobeV128') }

tasks.register('extractHorrorEquipmentV184', Copy) {
    from(zipTree(rootProject.file('master/source/equipment/horror_v184/generated_assets.zip')))
    into(layout.buildDirectory.dir('generated/wardrobe-v128'))
    includeEmptyDirs = false
    eachFile { f -> if (file('src/main/assets/' + f.path).exists()) f.exclude() }
}
tasks.named('extractHorrorEquipmentV184').configure { dependsOn('extractWardrobeV128') }
tasks.named('preBuild').configure { dependsOn('extractHorrorEquipmentV184') }

// Regenerate the reviewed sheets with exact per-family crop/projection metadata.
tasks.register('generateAbelV161', Exec) {
    inputs.files(rootProject.fileTree('master/source/abel_v161') { include '*.png' })
    inputs.file(rootProject.file('tools/build_abel_v161.py'))
    outputs.dir(layout.buildDirectory.dir('generated/abel-v161-pack'))
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/build_abel_v161.py'
}

// One synchronized pack removes obsolete species even on incremental builds.
tasks.register('extractAbelV139', Sync) {
    from(zipTree(rootProject.file('master/assets/abel_v139/generated_assets.zip'))) {
        exclude "**/red_octopus/**"
    }
    from(zipTree(rootProject.file('master/assets/abel_v140/generated_assets.zip'))) {
        exclude "**/crab/**", "**/berserker/**", "**/pong/**"
    }
    from(zipTree(rootProject.file('master/assets/abel_v141/generated_assets.zip')))
    from(zipTree(rootProject.file('master/assets/abel_v142/generated_assets.zip')))
    from(zipTree(rootProject.file('master/assets/rucesion_v158/generated_assets.zip')))
    from(zipTree(layout.buildDirectory.file('generated/abel-v161-pack/generated_assets.zip')))
    into(layout.buildDirectory.dir('generated/abel-v139'))
    includeEmptyDirs = false
}
tasks.named('extractAbelV139').configure { dependsOn('generateAbelV161') }
tasks.named('preBuild').configure { dependsOn('extractAbelV139') }


// Original Horror source decoding is offline and limited to retained source entries.
tasks.register('generateHorrorV180', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/build_horror_v180.py'
    inputs.files(rootProject.fileTree('master/source/horror_v180'), rootProject.file('tools/build_horror_v180.py'), rootProject.file('tools/horror_original_formats.py'), file('src/main/java/com/projectdark/mobile/world/HorrorCastleOriginalData.java'))
    outputs.dir(layout.buildDirectory.dir('generated/horror-v180-pack'))
}
tasks.named('preBuild').configure { dependsOn('generateHorrorV180') }

