plugins { id 'com.android.application' }

android {
    namespace 'com.projectdark.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.projectdark.mobile'
        minSdk 26
        targetSdk 35
        versionCode 47
        versionName '0.47-device-recording-fixes'
    }
    sourceSets {
        main {
            assets.srcDirs += ['../assets/milles/production', '../assets/pote/production']
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
