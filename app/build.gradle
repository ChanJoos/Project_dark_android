plugins { id 'com.android.application' }

android {
    namespace 'com.projectdark.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.projectdark.mobile'
        if (System.getenv('PROJECT_DARK_SIDE_BY_SIDE') == '1') applicationIdSuffix '.v128test'
        manifestPlaceholders = [appLabel: System.getenv('PROJECT_DARK_SIDE_BY_SIDE') == '1' ? 'PROJECT DARK V128 TEST' : 'PROJECT DARK']
        minSdk 26
        targetSdk 35
        versionCode 128
        versionName '1.28-identity-dual-equipment'
        buildConfigField 'String', 'SOURCE_SHA', '"' + (System.getenv('PROJECT_DARK_SOURCE_SHA') ?: 'LOCAL_UNVERIFIED') + '"'
    }
    buildFeatures { buildConfig true }
    sourceSets {
        main {
            assets.srcDirs += ['../assets/milles/production', '../assets/pote/production', layout.buildDirectory.dir('generated/build-identity').get().asFile, layout.buildDirectory.dir('generated/wardrobe-v128').get().asFile]
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        // Native source rendering retains large atlases; isolate each test class.
        unitTests.all {
            maxHeapSize = '1536m'
            maxParallelForks = 1
            forkEvery = 1
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

// The identity is embedded in the APK that was tested, not inferred from a release name.
def identitySource = System.getenv('PROJECT_DARK_SOURCE_SHA') ?: 'LOCAL_UNVERIFIED'
def identityRun = System.getenv('GITHUB_RUN_ID') ?: 'LOCAL'
tasks.register('writeBuildIdentity') {
    inputs.property('sourceCommit', identitySource)
    inputs.property('runId', identityRun)
    outputs.file(layout.buildDirectory.file('generated/build-identity/build_identity.json'))
    doLast {
        def out = layout.buildDirectory.file('generated/build-identity/build_identity.json').get().asFile
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.toJson([sourceCommit: identitySource, runId: identityRun, versionCode: 128, versionName: '1.28-identity-dual-equipment']) + '\n'
    }
}
tasks.named('preBuild').configure { dependsOn('writeBuildIdentity') }

// Retained exact asset bundle keeps fresh builds reproducible without network recovery.
tasks.register('extractWardrobeV128', Copy) {
    from(zipTree(rootProject.file('master/source/equipment/identity_v128/generated_assets.zip')))
    into(layout.buildDirectory.dir('generated/wardrobe-v128'))
    includeEmptyDirs = false
    eachFile { f -> if (file('src/main/assets/' + f.path).exists()) f.exclude() }
}
tasks.named('preBuild').configure { dependsOn('extractWardrobeV128') }
