plugins { id 'com.android.application' }

android {
    namespace 'com.projectdark.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.projectdark.mobile'
        minSdk 26
        targetSdk 35
        versionCode 62
        versionName '0.62-director-audit'
        testInstrumentationRunner 'com.projectdark.mobile.RuntimeSmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
