plugins { id 'com.android.application' }

android {
    namespace 'com.projectdark.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.projectdark.mobile'
        minSdk 26
        targetSdk 35
        versionCode 105
        versionName '1.05-lv40-progression'
    }
    sourceSets {
        main {
            assets.srcDirs += ['../assets/milles/production', '../assets/pote/production']
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        // Native source rendering retains large atlases; isolate each test class.
        unitTests.all {
            maxHeapSize = '1536m'
            maxParallelForks = 1
            forkEvery = 1
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
